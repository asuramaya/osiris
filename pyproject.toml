[project]
name = "osiris"
version = "0.0.0"
description = "The persistent memory and coordination graph for AI agents (MCP, DeepSeek Harness, Claude Code, Cursor)"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",          # async runtime DB driver (no sync drivers in app code)
    "arq>=0.26",              # async worker pool
    "redis>=5.2",             # queues, token buckets, pub/sub for UI feed
    "httpx>=0.28",            # async HTTP for connectors
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",        # structured JSON logs (case_id/helper_id in context)
    "pyyaml>=6.0",            # helper manifests
    "alembic>=1.14",          # migrations
    "psycopg[binary]>=3.2",   # sync driver — MIGRATIONS ONLY, never app runtime
    "playwright>=1.60.0",
    "cryptography>=48.0.0",
    "keyring>=25.7.0",
    "reportlab>=4.5.1",
    "phonenumbers>=9.0.31",
    "mcp>=1.28.1",
    "model2vec>=0.5",     # local static embeddings — the semantic search door (no GPU, no key)
    "numpy>=1.26",        # cosine over the cached vector matrix (semantics.py)
    "jinja2>=3.1.6",       # THE INBOX (task #71) — the sole renderer for src/api/inbox/render.py;
                           # already resolved transitively (model2vec) at this exact version
    "datastar-py>=1.0.2",  # THE INBOX — SSE/patch helpers matching vendored datastar-core.js v1.0.2
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",  # task #100 tail (Thoth msg 2224): `-n auto` parallelizes the
                          # suite across worker PROCESSES; tests/conftest.py shares ONE
                          # Postgres container across them (PYTEST_XDIST_WORKER_COUNT/
                          # workerinput), not one per worker
    "testcontainers[postgres]>=4.8",  # real Postgres in Docker for tests (not SQLite, not mocks)
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# tests legitimately do synchronous file IO inside async test bodies
"tests/**" = ["ASYNC230", "ASYNC240"]
# FastAPI's Depends()/Query() in argument defaults is the framework idiom
"src/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]            # mypy --strict clean on src/ (migrations excluded)

[[tool.mypy.overrides]]
module = ["asyncpg.*"]     # asyncpg ships no py.typed; treat as untyped at the boundary
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arq.*", "playwright.*"]   # partial/untyped public API at the worker/browser boundary
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["keyring.*", "reportlab.*", "phonenumbers.*"]   # no bundled stubs
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.mcp_server"]                  # FastMCP's .tool() is an untyped decorator
disallow_untyped_decorators = false
# FastMCP detects the context param by finding the BARE `Context` class inside the
# annotation's args (find_context_parameter uses issubclass on a class); a parametrized
# `Context[Any,Any,Any]` breaks that detection and turns ctx into a client-facing arg. So
# the annotation must stay bare `Context | None` — which trips mypy's type-arg check here.
disable_error_code = ["type-arg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# task #165 (2026-08-09): the bare `pytest` command CLAUDE.md prescribes becomes the
# correct one, zero flag to remember (decision c63f5bd9's own proposal, 2026-08-01,
# never landed until now). Fixed cap, not `-n auto` (20 cores): under real multi-agent
# fleet load — routinely 4-5 concurrent seats, confirmed live tonight — uncapped auto
# would multiply the exact shared-Postgres/MCP-pool contention this exists to reduce
# (c63f5bd9's own named, unmeasured-at-the-time risk). -n 4 measured against the
# now-honest suite (task #165's cmd_deploy fix landed first, removing the ~565s of
# unrelated network-contention cost that would have inflated any cap chosen against
# the old number): full suite 174.94s (was ~1160s serial pre-fix), 2978 passed/1
# skipped/0 failed. Confirmed a small targeted run (the CLAUDE.md-prescribed dev-loop
# hot path) is not slower or more ceremonial under this default: tests/test_semantics.py
# alone, 10.83s without vs 11.20s with -n 4 — noise, not a real cost.
addopts = "-n 4"

[tool.uv]
package = true

# task #69 (ruling 45b074bf): the `osiris` console-script — CWD/PYTHONPATH must never matter
# for the operator (the exact class 3e96c10e's cousin closes). `packages = ["src"]` installs
# the existing `src` top-level package as-is (every `from src.x import y` already assumes this
# name; nothing renamed) so the wheel matches the checkout 1:1 — no src-layout remapping.
[project.scripts]
osiris = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
