id: github_social
name: GitHub deeper (GPG-key emails + gists)
description: >
  Keyless enrichment of a confirmed github Account beyond the profile: GPG-key
  identities (cryptographically self-declared emails) and gist content (links/emails
  the user wrote but didn't list on the profile). Honours GITHUB_TOKEN.
consumes:
  type: Account
  requires_properties: []
emits:
  - type: Email
    confidence_floor: 0.7
  - type: Account
    confidence_floor: 0.6
tier: open
origin: api.github.com
rate:
  per_origin_rps: 0.2
  per_origin_concurrent: 1
  jitter_ms: [200, 800]
parser: github_social
cache_ttl: 86400
enabled: true
