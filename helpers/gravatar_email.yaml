id: gravatar_email
name: Gravatar profile lookup
description: >
  Resolve a public Gravatar profile for this email (keyless) — display name,
  location, and any linked social accounts. One of the few things a bare email
  reliably resolves to.
consumes:
  type: Email
  requires_properties: []
emits:
  - type: Person
    confidence_floor: 0.7
  - type: Account
    confidence_floor: 0.6
tier: open
origin: gravatar.com
parser: gravatar
cache_ttl: 86400
enabled: true
