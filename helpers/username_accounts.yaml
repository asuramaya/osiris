id: username_accounts
name: Username enumeration (footprint crawler)
description: >
  Probe a curated set of platforms (GitHub, GitLab, Keybase, Reddit, dev.to,
  PyPI, npm, ...) for an account with this username and materialize the ones
  that exist as Account objects. The core "map my whole footprint" sweep.
consumes:
  type: Username
  requires_properties: []
emits:
  - type: Account
    confidence_floor: 0.6
tier: open
origin: multi
rate:
  per_origin_rps: 2.0
  per_origin_concurrent: 8
parser: username_accounts
cache_ttl: 86400
enabled: true
