<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Osiris · Object</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2b333c;
    --text:#e6edf3; --muted:#8b949e; --accent:#3fb950; --blue:#58a6ff; --chip:#21262d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  header .sub{color:var(--muted);font-size:12px}
  .spacer{flex:1}
  .wrap{max-width:920px;margin:0 auto;padding:20px}
  .titlebar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .type{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--blue);
    background:#15263b;border:1px solid #1f3a5a;border-radius:999px;padding:2px 9px;font-weight:700}
  h1{font-size:20px;margin:0;font-weight:650}
  .canonical{color:var(--muted);font-size:12px;font-family:ui-monospace,Menlo,monospace;margin-bottom:14px}
  .demo{font-size:10px;color:#d2a8ff;background:#3a1d40;border:1px solid #57306b;border-radius:999px;
    padding:1px 8px;font-weight:700}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 20px}
  .btn{background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:7px;
    padding:7px 12px;font-size:13px;cursor:pointer}
  .btn.go{background:var(--accent);color:#06210f;border:0;font-weight:650}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  td.k{color:var(--muted);text-transform:capitalize;white-space:nowrap}
  .prov{color:var(--muted);font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
  .rel{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
  .rel:last-child{border-bottom:0}
  .reltype{color:var(--muted);font-size:11px;font-family:ui-monospace,Menlo,monospace;
    background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:1px 7px}
  .arrow{color:var(--muted)}
  .dossier{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,monospace;color:var(--text)}
  .empty{color:var(--muted)}
</style>
</head>
<body>
<header>
  <span>🜲 Osiris · Object</span>
  <span class="sub">the one noun — every surface opens here</span>
  <span class="spacer"></span>
  <a class="sub" href="/ui/watch.html">watch ▸</a>
  <a class="sub" href="/ui/">graph console ▸</a>
</header>

<div class="wrap" id="wrap"><div class="empty">Loading…</div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const ID = new URLSearchParams(location.search).get("id");
const HOW = {authoritative_api:"authoritative",self_declared:"self-declared",
  direct_observation:"observed",co_occurrence:"co-occurrence",derived:"inferred",
  corroborated:"corroborated"};

async function load(){
  if(!ID){ $("wrap").innerHTML = '<div class="empty">No object id.</div>'; return; }
  const o = await fetch("/objects/"+ID).then(r=>r.ok?r.json():null);
  if(!o){ $("wrap").innerHTML = '<div class="empty">Object not found.</div>'; return; }

  const nameProp = o.properties.find(p=>p.name==="name");
  const demo = o.properties.some(p=>p.name==="demo" && String(p.value).toLowerCase()==="true");
  const title = (nameProp && nameProp.value) || o.canonical;

  // PROPERTIES — the graded, multi-source facts, each with how it was obtained
  const facts = o.properties.filter(p=>!["name","demo","tag"].includes(p.name));
  const rows = facts.map(p=>`<tr>
      <td class="k">${esc(p.name)}</td>
      <td>${esc(p.value)}</td>
      <td class="prov">${esc(p.source_label||p.source_id||"—")}</td>
      <td class="prov">${esc(p.how||"—")}</td>
      <td class="prov">${p.confidence!=null?Math.round(p.confidence*100)+"%":"—"}</td>
    </tr>`).join("") || `<tr><td colspan="5" class="empty">No properties.</td></tr>`;

  $("wrap").innerHTML = `
    <div class="titlebar">
      <span class="type">${esc(o.type)}</span><h1>${esc(title)}</h1>
      ${demo?'<span class="demo">DEMO</span>':''}
      ${o.status&&o.status!=="active"?`<span class="prov">(${esc(o.status)})</span>`:''}
    </div>
    <div class="canonical">${esc(o.canonical)}</div>
    <div class="actions">
      <button class="btn go" onclick="showDossier()">Dossier ▸</button>
      <button class="btn" onclick="tagIt()">＋ Tag</button>
    </div>
    <div class="card"><h2>Properties · what we know &amp; how</h2>
      <table><thead><tr><th>Field</th><th>Value</th><th>Source</th><th>How</th><th>Conf</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="card"><h2>Relationships · walk the network</h2><div id="rels" class="empty">…</div></div>
    <div class="card" id="dossbox" style="display:none"><h2>Dossier</h2><div id="doss" class="dossier"></div></div>
  `;
  loadRels();
}

async function loadRels(){
  const g = await fetch(`/objects/${ID}/graph?hops=1`).then(r=>r.json());
  const labels = {}; g.nodes.forEach(n=>labels[n.id]={label:n.label,type:n.type});
  const rels = g.edges.filter(e=>e.source===ID||e.target===ID).map(e=>{
    const out = e.source===ID;
    const other = out ? e.target : e.source;
    const n = labels[other]||{label:other,type:"?"};
    return `<div class="rel">
      <span class="arrow">${out?'→':'←'}</span>
      <span class="reltype">${esc(e.type)}</span>
      <a href="/ui/object.html?id=${other}">${esc(n.label)}</a>
      <span class="prov">(${esc(n.type)})</span></div>`;
  }).join("");
  $("rels").innerHTML = rels || '<span class="empty">No links yet.</span>';
}

async function showDossier(){
  const box = $("dossbox"); box.style.display="block";
  $("doss").textContent = "loading…";
  const d = await fetch("/objects/"+ID+"/dossier").then(r=>r.ok?r.json():null);
  $("doss").textContent = d ? JSON.stringify(d, null, 2) : "No dossier for this object type.";
  box.scrollIntoView({behavior:"smooth"});
}

async function tagIt(){
  const tag = prompt("Tag this object:"); if(!tag) return;
  await fetch("/objects/"+ID+"/tags", {method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({tag, scope:"global"})});
  load();
}

load();
</script>
</body>
</html>
