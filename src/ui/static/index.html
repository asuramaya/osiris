<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Osiris · Analysis</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/layout-base/layout-base.js"></script>
<script src="https://unpkg.com/cose-base/cose-base.js"></script>
<script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<style>
  :root{
    --bg:#0b0e13; --panel:#11161d; --panel2:#161c25; --border:#222b36; --border2:#2c3744;
    --text:#e6edf3; --muted:#7d8896; --faint:#566069; --accent:#3fb950; --blue:#4493f8;
    --chip:#1b222c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);
    font:13px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  a{color:var(--blue);text-decoration:none}
  button,select,input{font:inherit;color:var(--text)}
  #app{display:grid;grid-template-rows:46px 1fr;height:100vh}

  /* top bar */
  #bar{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);
    border-bottom:1px solid var(--border)}
  #bar .brand{font-weight:650;letter-spacing:.2px}
  #bar .brand b{color:var(--accent)}
  select,.field{background:var(--bg);border:1px solid var(--border2);border-radius:7px;
    padding:6px 9px;font-size:12.5px}
  #search{width:340px}
  .iconbtn{background:var(--chip);border:1px solid var(--border2);border-radius:7px;
    padding:6px 10px;font-size:12px;cursor:pointer;color:var(--text)}
  .iconbtn:hover{border-color:var(--blue)}
  .spacer{flex:1}
  .badge{background:#3a1212;color:#ff7b72;border:1px solid #5a1d1d;border-radius:999px;
    padding:1px 7px;font-size:11px;font-weight:600}

  /* layout */
  #main{display:grid;grid-template-columns:264px 1fr 350px;height:100%;min-height:0}
  .rail{background:var(--panel);overflow-y:auto;min-height:0}
  #left{border-right:1px solid var(--border)}
  #right{border-left:1px solid var(--border)}
  .railhead{display:flex;align-items:center;gap:8px;padding:11px 14px 7px;
    font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);font-weight:600}
  .railhead .n{margin-left:auto;color:var(--muted);font-weight:500}
  .pad{padding:0 14px 14px}

  /* object set list */
  .filter{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:7px;
    padding:6px 9px;font-size:12px;margin:0 0 8px}
  .item{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;cursor:pointer;
    border:1px solid transparent}
  .item:hover{background:var(--panel2)} .item.sel{background:var(--panel2);border-color:var(--border2)}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .item .lab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .ty{font-size:10px;color:var(--faint)}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .empty{color:var(--faint);font-size:12px;padding:16px 0;text-align:center}

  /* center board */
  #center{display:grid;grid-template-rows:40px 1fr 24px;min-height:0;min-width:0}
  #tools{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel2);
    border-bottom:1px solid var(--border)}
  #tools .title{font-weight:600}
  #cy{background:
    radial-gradient(circle at 1px 1px, #161c25 1px, transparent 0) 0 0/22px 22px,var(--bg);
    min-height:0}
  #statusbar{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);
    border-top:1px solid var(--border);color:var(--faint);font-size:11px}
  .live{color:var(--accent)}

  /* inspector */
  .insp-empty{padding:40px 16px;color:var(--faint);font-size:12px;text-align:center}
  .insp-top{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .type{font-size:10px;letter-spacing:.5px;text-transform:uppercase;border-radius:999px;
    padding:2px 8px;font-weight:700}
  .insp-title{font-size:16px;font-weight:650;margin:8px 0 2px}
  .insp-canon{font-size:11px;color:var(--faint)}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .act{background:var(--chip);border:1px solid var(--border2);border-radius:7px;padding:6px 10px;
    font-size:12px;cursor:pointer}
  .act:hover{border-color:var(--blue)} .act.go{background:var(--accent);color:#06210f;border:0;font-weight:650}
  .sect{padding:12px 16px;border-bottom:1px solid var(--border)}
  .sect h3{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);
    margin:0 0 9px;font-weight:600}
  .pv{display:grid;grid-template-columns:96px 1fr;gap:3px 10px;font-size:12.5px}
  .pv .k{color:var(--muted);text-transform:capitalize}
  .pv .v{word-break:break-word}
  .pvs{color:var(--faint);font-size:10.5px;grid-column:2;margin:-1px 0 5px}
  .rel{display:flex;align-items:center;gap:7px;padding:5px 0}
  .reltype{color:var(--muted);font-size:10.5px;background:var(--chip);border:1px solid var(--border2);
    border-radius:5px;padding:0 6px}
  .demo{font-size:10px;color:#d2a8ff;background:#3a1d40;border:1px solid #57306b;border-radius:999px;
    padding:1px 7px;font-weight:700}

  /* popover (type key, add) */
  .pop{position:absolute;z-index:30;background:var(--panel);border:1px solid var(--border2);
    border-radius:9px;padding:12px;box-shadow:0 12px 40px #000a;font-size:12px;min-width:200px}
  .keyrow{display:flex;align-items:center;gap:8px;padding:2px 0}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="brand">◭ <b>Osiris</b></span>
    <select id="analysis" onchange="openAnalysis(this.value)" title="Analysis"></select>
    <button class="iconbtn" onclick="newAnalysis()" title="New analysis">＋</button>
    <input id="search" class="field" placeholder="Search the ontology — name or identifier…"
           oninput="debouncedSearch()" onfocus="debouncedSearch()" autocomplete="off" />
    <span class="spacer"></span>
    <button class="iconbtn" onclick="toggleKey(event)">Type key</button>
    <button class="iconbtn" onclick="openReview()">Review <span id="reviewN" class="muted">0</span></button>
    <a class="iconbtn" href="/ui/watch.html">Watch ▸</a>
  </div>

  <div id="main">
    <!-- LEFT: object set -->
    <aside id="left" class="rail">
      <div class="railhead">Object set <span class="n" id="setn">0</span></div>
      <div class="pad">
        <input id="filter" class="filter" placeholder="Filter the set…" oninput="renderSet()" />
        <div id="set"></div>
      </div>
      <div class="railhead">Add to analysis</div>
      <div class="pad">
        <input id="seed" class="filter" placeholder="paste an identifier or name…" />
        <button class="iconbtn" style="width:100%" onclick="addSeed()">Add &amp; classify</button>
        <div id="seedmsg" class="faint" style="margin-top:6px;font-size:11px"></div>
      </div>
    </aside>

    <!-- CENTER: the board -->
    <section id="center">
      <div id="tools">
        <span class="title" id="boardtitle">Board</span>
        <button class="iconbtn" id="aroundBtn" onclick="searchAround()" disabled>Search around</button>
        <button class="iconbtn" onclick="expandSet()" title="Run collectors to grow the set">Expand ▸</button>
        <span class="spacer"></span>
        <button class="iconbtn" onclick="cyFit()">Fit</button>
        <button class="iconbtn" onclick="relayout()">Re-layout</button>
        <button class="iconbtn" onclick="clearBoard()">Clear</button>
      </div>
      <div id="cy"></div>
      <div id="statusbar">
        <span id="status">Select an object to place it on the board.</span>
        <span class="spacer"></span><span id="live" class="live"></span>
      </div>
    </section>

    <!-- RIGHT: inspector (the one noun) -->
    <aside id="right" class="rail">
      <div class="insp-empty" id="insp">Select an object to inspect it.<br><br>
        Click anything — an object in the set, a node on the board, a related entity — and it
        opens here, with every fact and where it came from.</div>
    </aside>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const HOW = {authoritative_api:"authoritative",self_declared:"self-declared",
  direct_observation:"observed",co_occurrence:"co-occurrence",derived:"inferred",
  corroborated:"corroborated"};

// The type catalog is the SEMANTIC LAYER — fetched from /schema (ontology/schema.py),
// never hardcoded here. The UI is an application over the ontology; it reads, never defines.
let TYPE = {};
const DEF = {c:'#6e7681',s:'ellipse',category:'Other',description:'An ontology object.'};
const ty = t => TYPE[t]||DEF;
async function loadSchema(){
  const cat = await fetch('/schema').then(r=>r.json());
  TYPE = Object.fromEntries(cat.object_types.map(t=>[t.name,
    {c:t.color,s:t.shape,category:t.category,description:t.description}]));
}

let ANALYSIS=null, SET=[], FOCUS=null, STREAM=null;

// ---- cytoscape board -------------------------------------------------------
if (window.cytoscapeFcose) cytoscape.use(window.cytoscapeFcose);
const HAS_FCOSE = !!window.cytoscapeFcose;
const cy = cytoscape({ container:$('cy'), wheelSensitivity:.2, minZoom:.15, maxZoom:3,
  style:[
    {selector:'node',style:{'background-color':e=>ty(e.data('type')).c,'shape':e=>ty(e.data('type')).s,
      'width':30,'height':30,'border-width':0,'label':'data(label)','color':'#cdd6df','font-size':10.5,
      'text-valign':'bottom','text-margin-y':4,'text-wrap':'wrap','text-max-width':110,
      'text-background-color':'#0b0e13','text-background-opacity':.7,'text-background-padding':3,
      'text-background-shape':'roundrectangle','min-zoomed-font-size':7}},
    {selector:'node.focus',style:{'border-width':3,'border-color':'#4493f8'}},
    {selector:'edge',style:{'width':1.2,'line-color':'#2c3744','target-arrow-color':'#2c3744',
      'target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':.85,'label':'data(type)',
      'font-size':8.5,'color':'#7d8896','text-background-color':'#0b0e13','text-background-opacity':.85,
      'text-background-padding':2,'text-rotation':'autorotate','min-zoomed-font-size':7}},
  ]});
cy.on('tap','node',e=>focus(e.target.id()));
cy.on('dbltap','node',e=>searchAround(e.target.id()));

function layout(preserve){
  const o = HAS_FCOSE
    ? {name:'fcose',animate:true,animationDuration:300,randomize:!preserve,quality:'proof',
       nodeSeparation:120,idealEdgeLength:115,nodeRepulsion:9000,padding:45,packComponents:true}
    : {name:'cose',animate:false,padding:45,nodeRepulsion:12000,idealEdgeLength:120};
  cy.layout(o).run();
}
function mergeGraph(g){
  let added=0;
  g.nodes.forEach(n=>{ if(!cy.getElementById(n.id).length){
    cy.add({group:'nodes',data:{id:n.id,type:n.type,label:n.label}}); added++; }});
  g.edges.forEach(e=>{ const id=`${e.source}-${e.type}-${e.target}`;
    if(!cy.getElementById(id).length && cy.getElementById(e.source).length && cy.getElementById(e.target).length)
      cy.add({group:'edges',data:{id,source:e.source,target:e.target,type:e.type}}); });
  return added;
}
function cyFit(){ cy.animate({fit:{padding:50},duration:250}); }
function relayout(){ layout(false); }
function clearBoard(){ cy.elements().remove(); FOCUS=null; $('aroundBtn').disabled=true;
  setStatus('Board cleared.'); }
function setStatus(s){ $('status').textContent=s; }

// ---- analyses (cases) ------------------------------------------------------
async function loadAnalyses(){
  const cs = await fetch('/cases').then(r=>r.json());
  $('analysis').innerHTML = cs.map(c=>`<option value="${c.id}">${esc(c.name)} · ${c.object_count}</option>`).join('')
    || '<option value="">— no analyses —</option>';
  if(cs.length){ ANALYSIS=cs[0].id; await openAnalysis(ANALYSIS); }
}
async function newAnalysis(){
  const name = prompt('Name this analysis:'); if(!name) return;
  const r = await fetch('/cases',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({name})}).then(r=>r.json());
  await loadAnalyses(); $('analysis').value=r.id; openAnalysis(r.id);
}
async function openAnalysis(id){
  ANALYSIS=id; clearBoard();
  SET = await fetch(`/objects?case_id=${id}&limit=400`).then(r=>r.json());
  $('setn').textContent = SET.length; renderSet();
  refreshReview(); watch();
  if(SET.length) focus(SET[0].id);
  else setStatus('Empty analysis — add an object below, or run Expand.');
}
function renderSet(){
  const q=($('filter').value||'').toLowerCase();
  const rows = SET.filter(o => (o.name||o.canonical).toLowerCase().includes(q) || o.type.toLowerCase().includes(q));
  $('set').innerHTML = rows.slice(0,200).map(o=>`
    <div class="item${FOCUS===o.id?' sel':''}" onclick="focus('${o.id}')" title="${esc(o.canonical)}">
      <span class="dot" style="background:${ty(o.type).c}"></span>
      <span class="lab">${esc(o.name||o.canonical)}</span><span class="ty">${o.type}</span>
    </div>`).join('') || '<div class="empty">No objects match.</div>';
}

// ---- focus / inspect / search-around --------------------------------------
async function focus(id){
  FOCUS=id; $('aroundBtn').disabled=false; renderSet();
  if(!cy.getElementById(id).length) await searchAround(id, true);
  cy.nodes().removeClass('focus'); cy.getElementById(id).addClass('focus');
  inspect(id);
}
async function searchAround(id, quiet){
  id = id || FOCUS; if(!id) return;
  setStatus('Searching around…');
  const g = await fetch(`/objects/${id}/graph?hops=1`).then(r=>r.json());
  const added = mergeGraph(g);
  layout(cy.nodes().length>1);
  if(!quiet) cy.getElementById(id).select();
  setStatus(`${cy.nodes().length} objects on the board${added?` (+${added})`:''}.`);
  $('boardtitle').textContent = `Board · ${cy.nodes().length} objects`;
}

async function inspect(id){
  const o = await fetch('/objects/'+id).then(r=>r.ok?r.json():null);
  if(!o){ $('insp').className='insp-empty'; $('insp').textContent='Object not found.'; return; }
  const nameP=o.properties.find(p=>p.name==='name');
  const demo=o.properties.some(p=>p.name==='demo'&&String(p.value).toLowerCase()==='true');
  const title=(nameP&&nameP.value)||o.canonical;
  const m=ty(o.type);
  const facts=o.properties.filter(p=>!['name','demo','tag'].includes(p.name));
  const pv = facts.map(p=>`<div class="k">${esc(p.name)}</div><div class="v">${esc(p.value)}</div>
    <div class="pvs">${esc(p.source_label||p.source_id||'—')} · ${esc(p.how||'—')} · ${p.confidence!=null?Math.round(p.confidence*100)+'%':'—'}</div>`).join('')
    || '<div class="muted" style="grid-column:1/3">No properties.</div>';
  const right=$('right'); right.className='rail';
  right.innerHTML = `
    <div class="insp-top">
      <span class="type" style="color:${m.c};background:${m.c}1e;border:1px solid ${m.c}55">${esc(o.type)}</span>
      ${demo?'<span class="demo" style="margin-left:6px">DEMO</span>':''}
      <div class="insp-title">${esc(title)}</div>
      <div class="insp-canon mono">${esc(o.canonical)}</div>
      <div class="acts">
        <button class="act go" onclick="searchAround('${id}')">Search around</button>
        <button class="act" onclick="showDossier('${id}')">Dossier</button>
        <button class="act" onclick="tagIt('${id}')">Tag</button>
      </div>
    </div>
    <div class="sect"><h3>Properties · what &amp; how</h3><div class="pv">${pv}</div></div>
    <div class="sect"><h3>Relationships</h3><div id="rels" class="muted">…</div></div>
    <div class="sect" id="dossbox" style="display:none"><h3>Dossier</h3>
      <pre id="doss" class="mono" style="white-space:pre-wrap;font-size:11.5px;margin:0"></pre></div>`;
  loadRels(id);
}
async function loadRels(id){
  const g=await fetch(`/objects/${id}/graph?hops=1`).then(r=>r.json());
  const lab={}; g.nodes.forEach(n=>lab[n.id]=n);
  const rows=g.edges.filter(e=>e.source===id||e.target===id).map(e=>{
    const out=e.source===id, other=out?e.target:e.source, n=lab[other]||{label:other,type:'?'};
    return `<div class="rel"><span class="faint">${out?'→':'←'}</span>
      <span class="reltype">${esc(e.type)}</span>
      <a onclick="focus('${other}')" style="cursor:pointer">${esc(n.label)}</a>
      <span class="faint">${esc(n.type)}</span></div>`;
  }).join('');
  const el=$('rels'); if(el) el.innerHTML = rows || '<span class="faint">No links.</span>';
}
async function showDossier(id){
  $('dossbox').style.display='block'; $('doss').textContent='loading…';
  const d=await fetch('/objects/'+id+'/dossier').then(r=>r.ok?r.json():null);
  $('doss').textContent = d?JSON.stringify(d,null,2):'No dossier for this object type.';
}
async function tagIt(id){ const t=prompt('Tag:'); if(!t) return;
  await fetch('/objects/'+id+'/tags',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({tag:t,scope:'global'})}); inspect(id); }

// ---- add / expand ----------------------------------------------------------
async function addSeed(){
  const raw=$('seed').value.trim(); if(!raw||!ANALYSIS) return;
  const r=await fetch(`/cases/${ANALYSIS}/intake`,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({raw})}).then(r=>r.json());
  $('seed').value=''; $('seedmsg').textContent=`added ${r.type}`;
  await openAnalysis(ANALYSIS); focus(r.object_id);
}
async function expandSet(){
  if(!ANALYSIS) return;
  setStatus('Expanding — running collectors…'); $('live').textContent='● collecting';
  await fetch(`/cases/${ANALYSIS}/expand`,{method:'POST'});
}
function watch(){
  if(STREAM) STREAM.close();
  STREAM=new EventSource(`/cases/${ANALYSIS}/stream`);
  STREAM.onmessage=async ev=>{
    const s=JSON.parse(ev.data);
    $('live').textContent = s.total!=null ? `● ${s.total} objects` : '';
    const fresh=await fetch(`/objects?case_id=${ANALYSIS}&limit=400`).then(r=>r.json());
    if(fresh.length!==SET.length){ SET=fresh; $('setn').textContent=SET.length; renderSet();
      if(FOCUS) searchAround(FOCUS,true); }
  };
}

// ---- global search ---------------------------------------------------------
let st;
function debouncedSearch(){ clearTimeout(st); st=setTimeout(globalSearch,180); }
async function globalSearch(){
  const q=$('search').value.trim(); closePop();
  if(q.length<2) return;
  const res=await fetch(`/objects?q=${encodeURIComponent(q)}&limit=12`).then(r=>r.json());
  const pop=document.createElement('div'); pop.className='pop'; pop.id='searchpop';
  const r=$('search').getBoundingClientRect(); pop.style.left=r.left+'px'; pop.style.top=(r.bottom+5)+'px';
  pop.style.width=r.width+'px'; pop.style.maxHeight='340px'; pop.style.overflowY='auto';
  pop.innerHTML = res.length ? res.map(o=>`
    <div class="item" onmousedown="pick('${o.id}')">
      <span class="dot" style="background:${ty(o.type).c}"></span>
      <span class="lab">${esc(o.name||o.canonical)}</span><span class="ty">${o.type}</span>
    </div>`).join('') : '<div class="empty">No matches.</div>';
  document.body.appendChild(pop);
}
function pick(id){ closePop(); $('search').value=''; focus(id); }
function closePop(){ const p=$('searchpop'); if(p) p.remove(); const k=$('keypop'); }
document.addEventListener('click',e=>{ if(!e.target.closest('#search')&&!e.target.closest('#searchpop')) closePop(); });

// ---- type key + review -----------------------------------------------------
function toggleKey(ev){ ev.stopPropagation(); const ex=$('keypop'); if(ex){ex.remove();return;}
  const pop=document.createElement('div'); pop.className='pop'; pop.id='keypop';
  const r=ev.target.getBoundingClientRect(); pop.style.right='14px'; pop.style.top=(r.bottom+5)+'px';
  const cats={}; Object.entries(TYPE).forEach(([t,m])=>{(cats[m.category]=cats[m.category]||[]).push([t,m]);});
  pop.innerHTML=Object.entries(cats).map(([cat,ts])=>
    `<div class="faint" style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 2px">${cat}</div>`+
    ts.map(([t,m])=>`<div class="keyrow"><span class="dot" style="background:${m.c}"></span>${t}</div>`).join('')
  ).join('');
  document.body.appendChild(pop);
  setTimeout(()=>document.addEventListener('click',function h(){pop.remove();document.removeEventListener('click',h);}),0);
}
async function refreshReview(){
  const m=await fetch('/merge-candidates').then(r=>r.json()).catch(()=>[]);
  $('reviewN').textContent = (m&&m.length)||0;
}
async function openReview(ev){
  closePop();
  const m=await fetch('/merge-candidates').then(r=>r.json()).catch(()=>[]);
  const pop=document.createElement('div'); pop.className='pop'; pop.id='reviewpop';
  pop.style.right='14px'; pop.style.top='46px'; pop.style.width='320px';
  pop.style.maxHeight='60vh'; pop.style.overflowY='auto';
  pop.innerHTML = '<div class="railhead" style="padding:0 0 8px">Merge review · resolve in place</div>' +
    (m.length ? m.slice(0,40).map(c=>{
      const reason = Array.isArray(c.reasons)?c.reasons[0]:(c.reasons||'possible duplicate');
      return `<div style="padding:8px 0;border-top:1px solid var(--border)">
        <div><b>${Math.round((c.score||0)*100)}%</b> <span class="muted">${esc(reason)}</span></div>
        <div style="font-size:12px;margin:3px 0">
          <a onmousedown="pick('${c.a_id}')" style="cursor:pointer">${esc(c.a_label)}</a>
          <span class="faint">(${esc(c.a_type)})</span> <span class="faint">↔</span>
          <a onmousedown="pick('${c.b_id}')" style="cursor:pointer">${esc(c.b_label)}</a>
          <span class="faint">(${esc(c.b_type)})</span></div>
        <div class="acts" style="margin-top:3px">
          <button class="act go" onmousedown="resolveCand(${c.id},'merged')">Merge</button>
          <button class="act" onmousedown="resolveCand(${c.id},'rejected')">Reject</button></div></div>`;
    }).join('') : '<div class="empty">Nothing to review.</div>');
  document.body.appendChild(pop);
  setTimeout(()=>document.addEventListener('click',function h(e){
    if(!e.target.closest('#reviewpop')){pop.remove();document.removeEventListener('click',h);}},0);
}
async function resolveCand(id, decision){
  await fetch(`/merge-candidates/${id}/resolve`,{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify({decision})});
  await refreshReview();
  if(ANALYSIS){ SET=await fetch(`/objects?case_id=${ANALYSIS}&limit=400`).then(r=>r.json());
    $('setn').textContent=SET.length; renderSet(); }
  if(FOCUS) inspect(FOCUS);
  openReview();  // re-render the tray with the row gone
}

loadSchema().then(loadAnalyses);
</script>
