<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Osiris · Console</title>
<link rel="stylesheet" href="/ui/osiris.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<script src="/ui/vendor/marked.min.js"></script>
<style>
  #canvas-wrap { position: absolute; inset: 0; }
  #canvas-wrap canvas { display: block; }
  #labels { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .lbl { position: absolute; font-size: 10px; color: #c9d1d9; background: rgba(13,18,25,0.75);
         padding: 1px 4px; border-radius: 3px; transform: translate(-50%, -140%);
         white-space: nowrap; pointer-events: none; }
  .lbl.lit { color: #f0f6fc; background: rgba(35,55,80,0.9); font-weight: 600; }
  /* THE UNMISTAKABLE FOCUS (operator ruling, grounds 5b37d219, Thoth mail 11272 item 2):
     "the clicked object is unmistakable: a ring or halo, its label pinned and larger."
     focus-label is strictly bigger than even a lit label (not just bolder) and is never
     subject to positionLabels' own overlapsPlaced declutter -- it always shows. */
  .lbl.focus-label { font-size: 13px; padding: 2px 6px; }
  .lbl.project-label { color: #8ab4f8; font-weight: 700; font-size: 11px; padding: 2px 6px;
                         background: rgba(21,32,48,0.85); }
  .lbl.community-label { color: #d2a8ff; font-weight: 600; font-size: 10px; padding: 1px 5px;
                          background: rgba(28,20,42,0.85); }
  .focus-ring { position: absolute; border: 2px solid #58a6ff; border-radius: 50%;
                transform: translate(-50%, -50%); pointer-events: none;
                box-shadow: 0 0 8px rgba(88,166,255,0.6); }
  /* THE LEGIBILITY PASS, TIP 3 (Thoth mail 10930): the LOD glyph's own label -- a project
     or type summary ("name (count)") shown only at the far/mid zoom tiers, styled bigger
     and bolder than a plain node .lbl since it's standing in for a whole group, not one
     object. */
  .lod-glyph-label { position: absolute; font-size: 12px; font-weight: 700; color: #f0f6fc;
                      background: rgba(13,18,25,0.82); padding: 2px 7px; border-radius: 4px;
                      transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none;
                      letter-spacing: 0.2px; }
  /* THE DRILL (ruling d7d55257, Thoth mail 11048): a container's own type/"more" nodes and
     a cross-project anchor are genuinely clickable (expand, page, drill, or re-focus) --
     pointer-events: auto overrides the plain tier label's own none, plus a left accent so
     a reader can tell "this one does something" from "this one is just a name." */
  .ego-drill-label { pointer-events: auto; border-left: 2px solid #58a6ff; }
  .storyline-axis-label { color: #8b949e; font-weight: 400; font-size: 10px;
                           background: rgba(13,18,25,0.6); border-top: 1px solid #30363d; }
  /* THE LEGIBILITY PASS, TIP 1(f) (ruling e1cb9e3b): the table drawer owns the bottom edge
     now -- nothing floats in its collapsed 34px handle band any more (Thoth's own
     screenshot showed the canvas controls colliding with it there). */
  #space-status-line { position: absolute; bottom: 44px; left: 14px; z-index: 10;
                        font-size: 11px; color: var(--muted); }
  .hover-card { position: absolute; z-index: 12; pointer-events: none; max-width: 260px;
                background: rgba(13,18,25,0.92); backdrop-filter: blur(8px);
                border: 1px solid var(--border2); border-radius: 6px; padding: 6px 8px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .hover-label { font-size: 11px; color: #f0f6fc; font-weight: 600; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
  .hover-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .table-drawer { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
                  background: var(--panel); border-top: 1px solid var(--border2);
                  display: flex; flex-direction: column; height: 34px;
                  transition: height .15s ease; box-shadow: 0 -4px 14px rgba(0,0,0,0.35); }
  .table-drawer.open { height: 42%; }
  .table-drawer-handle { flex: 0 0 34px; display: flex; align-items: center; gap: 8px;
                          padding: 0 14px; cursor: pointer; font-size: 11px; font-weight: 600;
                          letter-spacing: .4px; text-transform: uppercase; color: var(--muted);
                          user-select: none; border: 0; background: none; width: 100%;
                          text-align: left; }
  .table-drawer-handle:hover { color: var(--text); }
  .table-drawer-chevron { transition: transform .15s ease; }
  .table-drawer.open .table-drawer-chevron { transform: rotate(180deg); }
  #browse-table { display: none; height: 100%; overflow: auto; padding: 12px 16px 24px; }
  .table-drawer.open #browse-table { display: block; }
  /* the browse drawer only ever makes sense alongside the space canvas — hidden whenever
     a non-browse surface takes over #result via the pre-existing #stage.panel toggle. */
  #stage.panel .table-drawer { display: none; }
  .legend-panel { position: absolute; top: 52px; right: 14px; z-index: 11; max-height: 60%;
                   overflow-y: auto; background: rgba(13,18,25,0.92); backdrop-filter: blur(8px);
                   border: 1px solid var(--border2); border-radius: 6px; padding: 8px 10px;
                   font-size: 11px; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .legend-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; color: var(--muted);
                cursor: pointer; white-space: nowrap; }
  .legend-row input { flex: none; }
  .legend-row.legend-class { color: var(--text); font-size: 11px; margin-top: 6px; }
  .legend-row.legend-class:first-child { margin-top: 0; }
  .legend-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
</style>
<style>
  .pop { position: absolute; z-index: 30; background: var(--panel); border: 1px solid var(--border2); border-radius: 9px; padding: 14px; box-shadow: 0 16px 48px rgba(0,0,0,0.6); font-size: 12px; min-width: 220px; }
  .keyrow { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="bar-left">
      <button class="nav-btn" onclick="toggleLeft()" title="Toggle sidebar ( [ )">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/></svg>
      </button>
      <div class="app-identity">
        <span class="app-brand">OSIRIS</span>
        <span class="app-title" id="page-title">Browse</span>
      </div>
      <div class="bar-divider"></div>
      <div class="scope-pill-wrap" id="repo-pill-wrap">
        <div class="scope-pill" id="repo-pill" onclick="toggleRepoDropdown(event)" title="Filter repos">
          <svg class="pill-icon" width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 2.5A.75.75 0 0 0 1 3.25v9.5c0 .414.336.75.75.75h12.5a.75.75 0 0 0 .75-.75v-7.5a.75.75 0 0 0-.75-.75H7.375L5.85 2.85A.75.75 0 0 0 5.3 2.5H1.75Z"/></svg>
          <span class="pill-value" id="repo-pill-label">All Repos</span>
          <svg class="pill-chevron" width="8" height="8" viewBox="0 0 16 16" fill="currentColor"><path d="m4.427 6.427 3.396 3.396a.25.25 0 0 0 .354 0l3.396-3.396A.25.25 0 0 0 11.396 6H4.604a.25.25 0 0 0-.177.427Z"/></svg>
        </div>
        <div class="custom-dropdown-menu" id="repo-dropdown" style="display:none" onclick="event.stopPropagation()">
          <div class="dd-items" id="repo-dd-items"></div>
          <div class="dd-action" onclick="selectRepos([]); closeAllDropdowns();">All Repos</div>
        </div>
      </div>
    </div>
    <div class="bar-center">
      <div class="global-search-container" id="search-container">
        <button class="search-compact-btn" id="search-compact-btn" onclick="expandSearchInput()" title="Search &amp; Commands (Ctrl+K)">🔍</button>
        <div class="global-search-box" id="global-search-box">
          <svg class="search-icon" width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>
          <input id="search" placeholder="Search entities, commands, tools... (Ctrl+K)" oninput="handleOmniSearchInput(this.value)" onfocus="openOmniSearch(this.value)" onkeydown="omniKey(event)" autocomplete="off" />
          <button class="search-clear-btn" id="search-clear-btn" onclick="clearOmniSearch(event)" style="display:none">×</button>
        </div>
        <div class="omni-dropdown" id="omni-dropdown" style="display:none" onclick="event.stopPropagation()">
          <div class="omni-list" id="omni-list"></div>
          <div class="omni-foot"><span><kbd>↵</kbd>select</span><span><kbd>↑↓</kbd>nav</span><span><kbd>esc</kbd>close</span></div>
        </div>
      </div>
    </div>
    <div class="bar-right">
      <span id="syncbadge" class="sync-indicator"></span>
      <!-- THE SETTINGS PANE (Thoth mail 13350): "a top-level 'Settings' entry (palette
           + a header link)" -- this is the header half; POWER_TOOLS carries the palette
           entry (console.js). -->
      <button class="nav-btn" onclick="renderSettingsPane()" title="Settings">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492ZM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0Z"/><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319Z"/></svg>
      </button>
      <button class="nav-btn" onclick="toggleRight()" title="Toggle inspector ( ] )">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.5A1.5 1.5 0 0 1 3.5 1h9A1.5 1.5 0 0 1 14 2.5v11a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5v-11ZM3.5 2.5a.5.5 0 0 0-.5.5V13a.5.5 0 0 0 .5.5H10V2.5H3.5ZM11 2.5V13.5h1.5a.5.5 0 0 0 .5-.5V3a.5.5 0 0 0-.5-.5H11Z"/></svg>
      </button>
    </div>
  </header>
  <div id="entity-taxonomy-bar" class="entity-taxonomy-bar">
    <div class="taxonomy-total"><strong class="total-num" id="entity-total-num">0</strong><span class="total-lbl">entities</span></div>
    <div class="taxonomy-nav" id="entity-type-pills"></div>
  </div>
  <div id="main">
    <aside id="left" class="rail">
      <div id="left-body" class="rail-body">
        <div class="railhead"><span>Console</span></div>
        <div class="pad core-lenses" id="nav-items">
          <div class="lens-item sel" data-surface="browse" id="nav-browse" onclick="switchSurface('browse')"><span class="lens-icon">▤</span><span>Browse</span></div>
          <div class="lens-item" data-surface="mailbox" id="nav-mailbox" onclick="switchSurface('mailbox')"><span class="lens-icon">✉</span><span>Mailbox</span></div>
          <div class="lens-item" data-surface="pane" id="nav-pane" onclick="switchSurface('pane')"><span class="lens-icon">▶</span><span>Pane</span></div>
        </div>
        <div class="railhead collect-only" style="display:none">Add to Analysis</div>
        <div class="pad collect-only" style="display:none"><input id="seed" class="filter" placeholder="Paste identifier or name…" /><button class="iconbtn" style="width:100%" onclick="addSeed()">Add &amp; Classify</button><div id="seedmsg" class="o-faint" style="margin-top:6px;font-size:11px"></div></div>
      </div>
    </aside>
    <div class="grip l" data-grip="l" title="drag to resize · double-click to reset"></div>
    <div id="stage">
      <div id="cy">
        <div id="canvas-wrap"></div>
        <div id="labels"></div>
        <div class="graph-canvas-controls">
          <span id="graph-level-badge" class="o-faint" style="align-self:center;font-size:11px;padding:0 4px"></span>
          <button class="iconbtn" id="fit-btn">Fit</button>
          <button class="iconbtn" id="up-btn">Clear focus</button>
          <button class="iconbtn" id="back-btn">Back</button>
          <button class="iconbtn" id="downstream-btn">Downstream: off</button>
          <button class="iconbtn" id="legend-btn">Legend</button>
        </div>
        <div id="legend-panel" class="legend-panel" hidden></div>
        <div id="graph-breadcrumbs" class="graph-breadcrumbs"></div>
        <div id="space-status-line">loading…</div>
      </div>
      <div class="table-drawer" id="browse-drawer">
        <button class="table-drawer-handle" id="browse-drawer-handle" onclick="toggleTableDrawer()">
          <span class="table-drawer-chevron">&#9650;</span>
          <span>Table</span>
          <span id="browse-drawer-count" class="o-faint" style="font-weight:400;text-transform:none;letter-spacing:0"></span>
        </button>
        <div id="browse-table"></div>
      </div>
      <div id="result"></div>
    </div>
    <div class="grip r" data-grip="r" title="drag to resize · double-click to reset"></div>
    <aside id="right" class="rail"><div class="insp-empty" id="insp"><div style="font-weight:700;font-size:13px;letter-spacing:0.5px;text-transform:uppercase;color:var(--text);margin-bottom:8px">Provenance Inspector</div>Select any entity to inspect its evidence grade and relationships.</div></aside>
  </div>
  <footer id="statusbar">
  <span class="status-label" id="status">Browse the graph.</span>
  <span class="spacer"></span>
  <span class="fleet-pulse" id="fleet-pulse"></span>
  <span class="bar-divider-vert"></span>
  <span class="focused-badge" id="focused-badge" style="display:none" onclick="inspectOnly(FOCUS)"></span>
</footer>
</div>
<div id="peek" class="peek-overlay"></div>
<script src="/ui/osiris.js"></script>
<script src="/ui/console.js"></script>
<script type="module">
  // NAVIGABLE SPACE, INTEGRATION (decision "NAVIGABLE SPACE, INTEGRATION SHAPE", mail 10550):
  // mounts the three.js renderer into #cy in place of the old cytoscape whole-graph/
  // focus content it replaces. window.__spaceReady lets console.js (a classic script,
  // loaded first, can't import this module) await the instance before wiring it up.
  import { initSpace } from "/ui/space.js";
  window.__spaceReady = initSpace({
    status: document.getElementById("space-status-line"),
    onFocus: (id) => { if (window.onSpaceFocus) window.onSpaceFocus(id); },
  }).then((api) => { window.OsirisSpace = api; return api; })
    .catch((err) => {
      console.error("space init failed", err);
      var el = document.getElementById("space-status-line");
      if (el) el.textContent = "ERROR: " + err.message;
    });
</script>
</body>
</html>
