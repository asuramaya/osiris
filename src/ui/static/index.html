<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Osiris · Composer</title>
<link rel="stylesheet" href="/ui/osiris.css" />
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/layout-base/layout-base.js"></script>
<script src="https://unpkg.com/cose-base/cose-base.js"></script>
<script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<script src="https://unpkg.com/marked@12.0.0/marked.min.js"></script>
<style>
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);overflow:hidden;
    font:13px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  button,select,input,textarea{font:inherit;color:var(--text)}
  #app{display:grid;grid-template-rows:46px 1fr;height:100vh}

  /* top bar */
  #bar{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);
    border-bottom:1px solid var(--border)}
  #bar .brand{font-weight:650;letter-spacing:.2px}
  #bar .brand b{color:var(--accent)}
  select,.field{background:var(--bg);border:1px solid var(--border2);border-radius:7px;padding:6px 9px;font-size:12.5px}
  #search{width:340px}
  .iconbtn{background:var(--chip);border:1px solid var(--border2);border-radius:7px;padding:6px 10px;
    font-size:12px;cursor:pointer;color:var(--text)}
  .iconbtn:hover{border-color:var(--blue)}
  .spacer{flex:1}

  /* layout */
  #main{display:grid;grid-template-columns:274px 1fr 350px;height:100%;min-height:0;
    transition:grid-template-columns .16s ease}
  /* calm: collapse the side panels to give the content room (U3 — open calm). NEVER
     display:none a panel — that drops it from the grid and shifts #center onto the 0px
     track (a 0-width center). Keep it a grid item at 0 width, clipped. */
  #main.lefthidden{grid-template-columns:0 1fr 350px}
  #main.lefthidden #left{overflow:hidden}
  #main.righthidden{grid-template-columns:274px 1fr 0}
  #main.righthidden #right{overflow:hidden}
  #main.lefthidden.righthidden{grid-template-columns:0 1fr 0}
  .panel-toggle{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:15px;
    padding:0 4px;line-height:1}
  .panel-toggle:hover{color:var(--text)}
  .rail{background:var(--panel);overflow-y:auto;min-height:0}
  #left{border-right:1px solid var(--border)}
  #right{border-left:1px solid var(--border)}
  .railhead{display:flex;align-items:center;gap:8px;padding:11px 14px 7px;font-size:10.5px;
    letter-spacing:.7px;text-transform:uppercase;color:var(--faint);font-weight:600}
  .railhead .n{margin-left:auto;color:var(--muted);font-weight:500}
  .railhead .add{margin-left:auto;cursor:pointer;color:var(--muted);font-size:14px;line-height:1}
  .railhead .add:hover{color:var(--accent)}
  .pad{padding:0 14px 14px}
  .filter{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:7px;padding:6px 9px;
    font-size:12px;margin:0 0 8px}

  /* composition list */
  .comp{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;
    border:1px solid transparent}
  .comp:hover{background:var(--panel2)} .comp.sel{background:var(--panel2);border-color:var(--border2)}
  .comp .cn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
  .kindb{font-size:9px;letter-spacing:.5px;text-transform:uppercase;border-radius:999px;padding:1px 6px;font-weight:700}
  .kindb.lens{color:var(--blue);background:#15263b;border:1px solid #1f3a5a}
  .kindb.watch{color:var(--accent);background:#10261a;border:1px solid #1d4a2e}

  /* object set */
  .item{display:flex;align-items:center;gap:8px;padding:4px 7px 4px 24px;border-radius:6px;cursor:pointer;border:1px solid transparent}
  .item:hover{background:var(--panel2)} .item.sel{background:var(--panel2);border-color:var(--border2)}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .item .lab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .item .ty{font-size:10px;color:var(--faint)}
  /* the object set, grouped by type — hierarchy over a flat hash list (U5) */
  .set-group{display:flex;align-items:center;gap:7px;padding:7px 7px 4px;cursor:pointer;user-select:none}
  .set-group:hover .set-gname{color:var(--text)}
  .set-caret{color:var(--faint);font-size:9px;width:9px}
  .set-gname{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  .set-gn{margin-left:auto;font-size:10.5px;color:var(--faint)}

  /* center: board OR result panel */
  #center{display:grid;grid-template-rows:40px auto 1fr 24px;min-height:0;min-width:0}
  /* ALWAYS a grid item (never display:none) — collapse to 0 height when empty instead. If it
     drops out of the grid, the rows shift up and #stage lands on the wrong track (0 height) →
     the blank board. :empty keeps the track present at 0px. */
  #composerbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 12px;
    background:var(--bg);border-bottom:1px solid var(--border);font-size:11.5px}
  #composerbar:empty{padding:0;border:0}
  .lin{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
  .lin .step{background:var(--chip);border:1px solid var(--border2);border-radius:6px;padding:2px 7px;white-space:nowrap}
  .lin .arr{color:var(--faint)}
  .fchip{display:inline-flex;align-items:center;gap:5px;background:#15263b;border:1px solid #1f3a5a;
    border-radius:999px;padding:2px 5px 2px 9px;color:var(--blue)}
  .fchip .x{cursor:pointer;opacity:.7;font-weight:700} .fchip .x:hover{opacity:1}
  .cbtn{background:var(--chip);border:1px solid var(--border2);border-radius:6px;padding:3px 8px;
    cursor:pointer;color:var(--text);font-size:11px}
  .cbtn:hover{border-color:var(--blue)}
  #tools{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel2);border-bottom:1px solid var(--border)}
  #tools .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34%}
  .viewsw{display:inline-flex;gap:0;border:1px solid var(--border2);border-radius:7px;overflow:hidden}
  .viewsw button{background:transparent;border:0;border-left:1px solid var(--border2);padding:5px 10px;
    font-size:11.5px;cursor:pointer;color:var(--muted)}
  .viewsw button:first-child{border-left:0}
  .viewsw button.on{background:var(--chip);color:var(--text)}
  .viewsw button:hover{color:var(--text)}
  #stage{position:relative;min-height:0}
  #cy{position:absolute;inset:0;background:
    radial-gradient(circle at 1px 1px,#161c25 1px,transparent 0) 0 0/22px 22px,var(--bg)}
  #result{position:absolute;inset:0;overflow:auto;padding:18px 22px;background:var(--bg);display:none}
  #stage.panel #cy{display:none} #stage.panel #result{display:block}
  #statusbar{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);
    border-top:1px solid var(--border);color:var(--faint);font-size:11px}
  .live{color:var(--accent)}

  /* inspector */
  .insp-empty{padding:40px 16px;color:var(--faint);font-size:12px;text-align:center}

  /* popovers */
  .pop{position:absolute;z-index:30;background:var(--panel);border:1px solid var(--border2);border-radius:9px;
    padding:12px;box-shadow:0 12px 40px #000a;font-size:12px;min-width:200px}
  .keyrow{display:flex;align-items:center;gap:8px;padding:2px 0}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{padding:4px 10px;border-radius:6px;background:var(--chip);border:1px solid var(--border2);cursor:pointer}
  .tab.on{border-color:var(--blue);color:var(--blue)}
  .cond{display:grid;grid-template-columns:1fr 58px 1fr;gap:5px;margin-top:5px}
  .cond select{width:58px;padding:5px}
  label{display:block;font-size:11px;color:var(--muted);margin:8px 0 3px}
  textarea{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:7px;
    padding:7px 9px;font:11.5px/1.45 ui-monospace,Menlo,monospace;min-height:120px;resize:vertical}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button class="panel-toggle" onclick="toggleLeft()" title="Toggle sidebar ( [ )">☰</button>
    <span class="brand">◭ <b>Osiris</b></span>
    <span id="syncbadge" class="syncbadge" title="Live shared cursor with Claude">⟲ live</span>
    <select id="room" onchange="switchRoom(this.value)" title="Room — your stance"></select>
    <button class="iconbtn" onclick="newRoom()" title="New room">＋</button>
    <span class="o-faint">/</span>
    <select id="analysis" onchange="openAnalysis(this.value)" title="Analysis"></select>
    <button class="iconbtn collect-only" onclick="newAnalysis()" title="New analysis">＋</button>
    <input id="search" class="field" placeholder="Find an object…"
           oninput="debouncedSearch()" onfocus="debouncedSearch()" autocomplete="off" />
    <button class="kbtn" onclick="openPalette()" title="Command palette">⌘K</button>
    <span class="spacer"></span>
    <button class="iconbtn" onclick="toggleKey(event)">Type key</button>
    <button class="iconbtn" onclick="openReview()">Review <span id="reviewN" class="o-muted">0</span></button>
    <button class="panel-toggle" onclick="toggleRight()" title="Toggle inspector ( ] )">⊟</button>
  </div>

  <div id="main">
    <!-- LEFT: compositions (the questions) + the object set -->
    <aside id="left" class="rail">
      <div class="railhead">Compositions <span class="add" title="New composition" onclick="openCompose(event)">＋</span></div>
      <div class="pad"><div id="comps"></div></div>

      <div class="railhead">Object set <span class="n" id="setn">0</span></div>
      <div class="pad">
        <input id="filter" class="filter" placeholder="Filter the set…" oninput="renderSet()" />
        <div id="set"></div>
      </div>

      <div class="railhead collect-only">Add to analysis</div>
      <div class="pad collect-only">
        <input id="seed" class="filter" placeholder="paste an identifier or name…" />
        <button class="iconbtn" style="width:100%" onclick="addSeed()">Add &amp; classify</button>
        <div id="seedmsg" class="o-faint" style="margin-top:6px;font-size:11px"></div>
      </div>
    </aside>

    <!-- CENTER: the render target (board for objects; panel for values/rows/data) -->
    <section id="center">
      <div id="tools">
        <span class="title" id="boardtitle">Board</span>
        <span id="viewsw" class="viewsw"></span>
        <button class="iconbtn collect-only" onclick="expandSet()" title="Run collectors to grow the set">Expand ▸</button>
        <span class="spacer"></span>
        <!-- board fiddly verbs — quiet by default, reveal on hover; all also in ⌘K (U4) -->
        <span class="boardtools">
        <button class="iconbtn" onclick="board.fit()">Fit</button>
        <button class="iconbtn" onclick="board.layout(false)">Re-layout</button>
        <button class="iconbtn" onclick="clearAll()">Clear</button>
        </span>
      </div>
      <div id="composerbar"></div>
      <div id="stage">
        <div id="cy"></div>
        <div id="result"></div>
      </div>
      <div id="statusbar">
        <span id="status">Run a composition, or place an object on the board.</span>
        <span class="spacer"></span><span id="live" class="live"></span>
      </div>
    </section>

    <!-- RIGHT: inspector (the one noun) -->
    <aside id="right" class="rail">
      <div class="insp-empty" id="insp">Select an object to inspect it.<br><br>
        Click anything — an object in the set, a node on the board, a related entity — and it
        opens here with every fact and where it came from.</div>
    </aside>
  </div>
</div>

<!-- the command surface: ⌘K / slash palette — the one home for every action (U1) -->
<div id="palette" class="palette-overlay"></div>
<!-- summoned "peek" surfaces (review / compose) — their own clean panel, never over the rail (U2) -->
<div id="peek" class="peek-overlay"></div>

<script src="/ui/osiris.js"></script>
<script>
const { $, esc, ty, objectDetail, loadRels, makeBoard, renderResult } = Osiris;
let ANALYSIS=null, SET=[], FOCUS=null, STREAM=null, COMPS=[], ACTIVE=null, ROOM='', ROOMS=[];
const roomQ = () => ROOM ? `?room=${ROOM}` : '';   // '' = the All room (god view)

// ---- the shared cursor: real-time bidirectional sync with Claude -----------
// One console state both Claude (MCP) and this browser read/write. Claude focuses an object
// or runs a lens → the screen follows; the operator navigates → Claude reads their cursor.
// Echo-suppression: every write bumps `rev`; we ignore stream events at or below the last
// rev we reconciled, and SYNCING gates our own posts while APPLYING a remote move.
let CONSOLE_REV=-1, SYNCING=false;
function postConsole(fields){
  if(SYNCING) return;  // don't echo a move we're applying FROM the cursor
  fetch('/console',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify(Object.assign({by:'human'},fields))})
    .then(r=>r.json()).then(s=>{ if(s&&s.rev!=null) CONSOLE_REV=s.rev; }).catch(()=>{});
}
function setSyncBadge(by){
  const b=$('syncbadge'); if(!b) return;
  b.textContent = by==='claude' ? '⟲ Claude moved' : '⟲ live';
  b.classList.toggle('claude', by==='claude');
  if(by==='claude'){ clearTimeout(setSyncBadge._t);
    setSyncBadge._t=setTimeout(()=>{ b.textContent='⟲ live'; b.classList.remove('claude'); },2500); }
}
function watchConsole(){
  const es=new EventSource('/console/stream');
  es.onmessage=async ev=>{
    const s=JSON.parse(ev.data);
    if(s.rev==null || s.rev<=CONSOLE_REV) return;   // our own echo, or stale
    CONSOLE_REV=s.rev;
    if(s.updated_by!=='human') await applyConsole(s);  // a remote (Claude) move → follow it
  };
}
async function applyConsole(s){
  SYNCING=true;
  try{
    setSyncBadge(s.updated_by);
    const compChanged = s.composition && s.composition!==ACTIVE;
    if(s.room_id && s.room_id!==ROOM) await switchRoom(s.room_id);
    if(s.focused_object_id && s.focused_object_id!==FOCUS) inspectOnly(s.focused_object_id);
    if(compChanged) await runComp(s.composition);
    // apply a synced view ONLY on the current composition — never let a stale view override a
    // freshly-run composition's shape-aware default (the graph-instead-of-timeline bug).
    if(s.view && RESULT && s.view!==VIEW && !compChanged) setView(s.view);
  } finally { SYNCING=false; }
}

// ---- rooms: the stance (journalist / broker / engineer — segmentation, not silos) ------
async function loadRooms(){
  ROOMS = await fetch('/rooms').then(r=>r.json());
  $('room').innerHTML = `<option value="">All</option>` + ROOMS.map(r=>
    `<option value="${r.id}">${esc(r.name)} · ${r.cases}/${r.compositions}</option>`).join('');
  $('room').value = ROOM;
}
async function switchRoom(id){
  ROOM=id; postConsole({room_id:id||null}); $('room').value=id;
  ACTIVE=null; RESULT=null; WORKING=null; renderSwitcher(); renderComposerBar(); board.clear(); showBoard();
  await loadComps(); await loadAnalyses();
  const room = ROOMS.find(r=>r.id===id);
  // COLLECTION is persona-scoped: the intake box + Expand-collectors + New-analysis are shown
  // only for a room that opts in (`config.collect`). The developer ingests via CLI, so the
  // engineer room hides them — the frame stays neutral, not an entity-collection console.
  const collect = !!(room && room.config && room.config.collect);
  document.querySelectorAll('.collect-only').forEach(el=> el.style.display = collect ? '' : 'none');
  // ORIENT ON ARRIVAL: a desk auto-runs its home composition (the briefing — "where am I?").
  const home = room && room.config && room.config.home;
  if(home) await runComp(home);
}
async function newRoom(){
  const name = prompt('Name this room (your stance — e.g. journalist, broker, engineer):');
  if(!name) return;
  const r = await fetch('/rooms',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({name})}).then(r=>r.json());
  await loadRooms(); switchRoom(r.id);
}

const board = makeBoard($('cy'),
  (id, deep, type)=> deep ? primaryAction(id, type) : inspectOnly(id),   // tap=select, dbl=primary
  (id, type, ev)=> ev && showActionMenu(ev.clientX, ev.clientY, id, type));  // right-click=menu
function setStatus(s){ $('status').textContent=s; }
function showBoard(){ $('stage').classList.remove('panel'); }
function showPanel(){ $('stage').classList.add('panel'); }

// ---- compositions (lenses + watches — one primitive) -----------------------
// THE SHELF (ruling 923c380f): lenses grouped by PURPOSE, each saying when to open it —
// the end of 19 flat chips in builder-dialect. engine/casework shelves fold by default.
const SHELVES=[['arrive','ARRIVE'],['wall','THE WALL'],['memory','MEMORY'],['fleet','FLEET'],
               ['casework','CASEWORK'],['engine','ENGINE'],['_more','MORE']];
async function loadComps(){
  COMPS = await fetch('/compositions'+roomQ()).then(r=>r.json());
  const bySec={}; COMPS.forEach(c=>{ (bySec[c.section||'_more'] ||= []).push(c); });
  $('comps').innerHTML = COMPS.length ? SHELVES.map(([key,label])=>{
    const list=bySec[key]||[]; if(!list.length) return '';
    const open = key!=='engine' && key!=='casework' && key!=='_more';
    return `<details class="shelf"${open?' open':''}><summary>${label} <span class="o-faint">${list.length}</span></summary>${
      list.map(c=>`
      <div class="comp${ACTIVE===c.name?' sel':''}" onclick="runComp('${esc(c.name)}')" title="${esc(c.description||JSON.stringify(c.spec))}">
        <span class="cn">${esc(c.name)}</span>
        <span class="kindb ${c.kind==='watch'?'watch':'lens'}">${c.kind}</span>
        ${c.description?`<div class="cdesc">${esc(c.description)}</div>`:''}
      </div>`).join('')}</details>`;
  }).join('') : '<div class="o-empty">No compositions yet. ＋ to author one.</div>';
}
// W1: a composition yields a SET; the center is a switchable VIEW of that set. The result
// is its own thing — running a composition shows it CLEANLY, never merged into the
// exploration board.
let RESULT=null, VIEW=null, WORKING=null;
async function runComp(name){
  // clear the synced view so a new composition starts at its own shape-aware default
  ACTIVE=name; postConsole({composition:name, view:null}); loadComps();
  setStatus(`Running ${name}…`);
  const res = await fetch(`/compositions/${encodeURIComponent(name)}/run`,{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify({subject:FOCUS})}).then(r=>r.json());
  if(res.error){ RESULT=null; WORKING=null; renderSwitcher(); renderComposerBar(); showPanel();
    $('result').innerHTML=`<div class="o-empty">${esc(res.error)}<br><br>
      Tip: focus a subject object first, then run.</div>`; $('boardtitle').textContent=name; return; }
  RESULT=res; RESULT.name=name; WORKING = res.spec ? JSON.parse(JSON.stringify(res.spec)) : null;
  VIEW=Osiris.defaultView(res); renderSwitcher(); await renderCurrent();
}

// W4: the inline composer. The active result's op-tree is shown as a lineage breadcrumb +
// editable filter chips; editing re-runs an EPHEMERAL working spec (no save) until "Save as".
function renderComposerBar(){
  const bar=$('composerbar');
  if(!RESULT || !WORKING){ bar.className=''; bar.innerHTML=''; return; }
  bar.className='on';
  const steps = Osiris.lineage(WORKING);
  const lin = `<span class="lin">${steps.map((s,i)=>
    (i?'<span class="arr">→</span>':'')+`<span class="step">${esc(s)}</span>`).join('')}</span>`;
  const sel = Osiris.innerSelect(WORKING);
  let chips='';
  if(sel){
    chips = (sel.where||[]).map((c,i)=>`<span class="fchip">${esc(c.property)}${Osiris.OPSYM[c.op]||c.op}${esc(c.value)}
      <span class="x" data-rmf="${i}">×</span></span>`).join('') + `<span class="cbtn" id="addf">+ filter</span>`;
  }
  const grp = RESULT.kind==='objects' ? `<span class="cbtn" id="groupby">Group by…</span>` : '';
  bar.innerHTML = lin + `<span style="flex:1"></span>` + chips + grp
    + `<span class="cbtn" id="saveas">Save as…</span>`;
  bar.querySelectorAll('[data-rmf]').forEach(x=>x.onclick=()=>{ sel.where.splice(+x.dataset.rmf,1); runWorking(); });
  if($('addf')) $('addf').onclick=addFilter;
  if($('groupby')) $('groupby').onclick=groupBy;
  $('saveas').onclick=saveWorkingAs;
}
// scale: collapse an object set into a count-per-group histogram (Foundry's move) — wrap
// the working spec in aggregate→order. Composes with the filter chips above it.
function groupBy(){
  const property=prompt('Group by property (e.g. type, sector):'); if(!property) return;
  WORKING = {op:'order',dir:'desc',from:{op:'aggregate',group_by:[property],
            metric:{type:'count'},from:WORKING}};
  runWorking();
}
function addFilter(){
  const sel=Osiris.innerSelect(WORKING); if(!sel) return;
  const property=prompt('Filter property (e.g. sector, authored_date):'); if(!property) return;
  const op=prompt('op — eq / contains / lt / gt','eq')||'eq';
  const value=prompt('value:'); if(value==null) return;
  sel.where=sel.where||[]; sel.where.push({property,op,value}); runWorking();
}
async function runWorking(){
  setStatus('Re-running with edits…');
  const res=await fetch('/compositions/run-spec',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({spec:WORKING,subject:FOCUS,name:RESULT.name})}).then(r=>r.json());
  if(res.error){ setStatus(res.error); return; }
  const name=RESULT.name; RESULT=res; RESULT.name=name;
  WORKING = res.spec ? JSON.parse(JSON.stringify(res.spec)) : WORKING;
  VIEW=Osiris.defaultView(res); renderSwitcher(); await renderCurrent();
}
async function saveWorkingAs(){
  const name=prompt('Save this composition as:', (RESULT.name||'lens')+' (edited)'); if(!name) return;
  await fetch('/compositions',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({name,spec:WORKING,kind:'lens',room_id:ROOM||null})});
  await loadComps(); setStatus(`Saved '${name}' to this room.`);
}
// a table row inspects in place (right panel) — it does NOT switch the center to the board,
// so you keep your result set. (A graph node tap goes through focus(), which explores.)
// single-click = SELECT: inspect the object + post the cursor (Claude follows), never touching
// the center lens or the board. The one light, safe click — same meaning everywhere.
function inspectOnly(id){ FOCUS=id; postConsole({focused_object_id:id}); renderSet(); inspect(id); }
// A composition RESULT is ONE view — sync the OTHER two panes to it so they don't keep showing
// a stale entity (the "panes don't sync" bleed: center=projects while the rail=Zephyr). A lens
// has no single focused object → clear the inspector; if the result IS an object set the left
// set reflects it, else the set clears. This makes the three panes one coherent view.
function syncPanesToResult(){
  // a composition RESULT is a CENTER view, not a single selected object: clear the inspector to
  // a summary and drop the focus highlight. The left OBJECT SET is the analysis's STABLE working
  // set (its navigator) and is deliberately LEFT ALONE — running a lens must not empty it. That
  // clobber was the "OBJECT SET 60 / No objects match" mismatch.
  FOCUS=null; renderSet();
  const right=$('right'); right.className='rail';
  right.innerHTML = `<div class="insp-empty">Showing <b>${esc(RESULT?RESULT.name:'')}</b> — ${
    RESULT?RESULT.count:0} ${RESULT?RESULT.kind:''}.<br><br>${
    RESULT&&RESULT.kind==='objects' ? 'Click a row to inspect an object.'
      : 'A lens over the graph — no single object to inspect.'}</div>`;
}
// TRIAGE (ruling 923c380f): deliberate clicks write through the Actions waist as
// analyst:operator — the console's read-only constitution amended by the operator's word.
async function triage(ids, verb){
  const because = ($('triage-why')&&$('triage-why').value) || '';
  if(verb==='resolve' && !because && !confirm(`resolve ${ids.length} thread(s) with no reason?`)) return;
  const r = await fetch('/threads/triage',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({ids, verb, because})}).then(r=>r.json());
  setStatus(`triage ${verb}: ${r.acted} acted${r.missed?`, ${r.missed} missed`:''} · signed analyst:operator`);
  if(ACTIVE) runComp(ACTIVE);   // re-run the lens — the pile shrinks before your eyes
}
function triageSelected(verb){
  const ids=[...document.querySelectorAll('.tri-pick:checked')].map(x=>x.value);
  if(ids.length) triage(ids, verb);
}
const pill=(t,cls)=>t?`<span class="wpill ${cls||''}">${esc(t)}</span>`:'';
function threadRow(t, withPick){
  return `<div class="wrow">${withPick?`<input type="checkbox" class="tri-pick" value="${esc(t.id)}">`:''}
    <span class="o-faint">${esc(t.id||'')}</span> ${esc(t.summary)}
    ${pill(t.kind, t.kind==='obligation'?'ob':'')}${pill(t.owner&&('@'+t.owner),'own')}${pill(t.born,'')}
    <span class="wacts">
      <a onclick="triage(['${esc(t.id)}'],'resolve')" title="done or moot — closes it">resolve</a>
      <a onclick="triage(['${esc(t.id)}'],'obligation')" title="adopt as real owed work">adopt</a>
      <a onclick="triage(['${esc(t.id)}'],'question')" title="remembered, not work — leaves the wall">question</a>
    </span></div>`;
}
const triageBar = `<div class="triagebar"><input id="triage-why" placeholder="because… (rides every act below)">
    <button onclick="triageSelected('resolve')">resolve selected</button>
    <button onclick="triageSelected('obligation')">adopt selected</button>
    <button onclick="triageSelected('question')">question selected</button></div>`;
// shape-detected custom views: the-wall (project + fleet) and the echoes pile
function renderWallView(res){
  const it=res.items;
  if(!it || typeof it!=='object' || Array.isArray(it)) return null;
  if(Array.isArray(it.wall) && it.echo_pile){
    return `<div class="wallview"><h3>the wall <span class="o-faint">${it.wall.length}${it.more_on_wall?` +${it.more_on_wall} more`:''}</span></h3>
      ${it.wall.map(t=>threadRow(t,false)).join('')||'<div class="o-empty">clear.</div>'}
      <h3>the echo pile <span class="o-faint">${it.echo_pile.count}</span></h3>
      <div class="o-empty">${esc(it.echo_pile.note||'')} — open the <b>echoes</b> lens to triage.</div></div>`;
  }
  if(it.totals && Array.isArray(it.top_of_wall)){
    return `<div class="wallview">
      <div class="wtotals">open <b>${it.totals.open}</b> · obligations <b>${it.totals.obligations}</b> · echo pile <b>${it.totals.pile}</b></div>
      <h3>top of the wall <span class="o-faint">${it.top_of_wall.length}${it.more_on_wall?` +${it.more_on_wall} more`:''}</span></h3>
      ${it.top_of_wall.map(t=>threadRow(t,false)).join('')}
      <h3>per project</h3>
      <table class="r-table"><thead><tr><th>project</th><th>open</th><th>obligations</th><th>touched</th><th>echo pile</th></tr></thead>
      <tbody>${it.projects.map(p=>`<tr><td>${esc(p.project)}</td><td>${p.open}</td><td>${p.obligations}</td><td>${p.touched}</td><td>${p.pile}</td></tr>`).join('')}</tbody></table>
      <div class="o-empty">${esc(it.note||'')}</div></div>`;
  }
  if(Array.isArray(it.echoes)){
    return `<div class="wallview"><h3>the echo pile <span class="o-faint">${it.count}</span></h3>${triageBar}
      ${it.echoes.map(t=>threadRow(t,true)).join('')||'<div class="o-empty">the pile is empty.</div>'}
      <div class="o-empty">${esc(it.note||'untouched miner echoes, oldest first — your judgment is testimony; never resolve what merely looks stale.')}</div></div>`;
  }
  return null;
}
async function renderCurrent(){
  if(!RESULT) return;
  const custom = renderWallView(RESULT);
  if(custom){ showPanel(); $('result').innerHTML=custom;
    $('boardtitle').textContent = `${RESULT.name} · ${RESULT.kind}`;
    setStatus(`${RESULT.name} — graded.`); syncPanesToResult(); renderComposerBar(); return; }
  if(VIEW==='graph') showBoard();  // reveal BEFORE placeObjects lays out, so #cy is measurable
  const mode = await renderResult(RESULT, {board, panel:$('result')}, VIEW, inspectOnly, drillInto,
    (id, type, ev)=> showActionMenu(ev.clientX, ev.clientY, id, type));  // right-click on result rows
  if(mode==='graph'){ showBoard(); board.resizeFit(); board.layout(true); } else showPanel();
  $('boardtitle').textContent = `${RESULT.name} · ${RESULT.kind} · ${RESULT.count}`;
  setStatus(`${RESULT.name} → ${RESULT.count} ${RESULT.kind}.`);
  syncPanesToResult();
  renderComposerBar();
}
function renderSwitcher(){
  const el=$('viewsw');
  const views = RESULT ? Osiris.viewsFor(RESULT) : [];
  if(!views.length){ el.innerHTML=''; return; }
  el.innerHTML = views.map(v=>
    `<button class="${v===VIEW?'on':''}" onclick="setView('${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join('');
}
// drill an aggregate group into the objects it counts: rebuild the base select + filter it to
// the group, then run it. 'changelog by area' → click 'composer' → select Commit where
// scope=composer. The aggregate's own op-tree carries everything we need.
function aggNode(spec){ for(let s=spec; s&&typeof s==='object'; s=s.from) if(s.op==='aggregate') return s; return null; }
async function drillInto(group, spec){
  const agg=aggNode(spec); if(!agg){ setStatus("This result can't be drilled."); return; }
  const base=agg.from && agg.from.op==='select' ? JSON.parse(JSON.stringify(agg.from)) : {op:'select'};
  base.where=(base.where||[]).concat((agg.group_by||[]).map(p=>({property:p,op:'eq',value:String(group[p]??'')})));
  const label=(agg.group_by||[]).map(p=>`${p}=${group[p]??'(none)'}`).join(', ');
  setStatus(`Opening ${label}…`);
  const res=await fetch('/compositions/run-spec',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({spec:base,subject:FOCUS,name:`${ACTIVE||'group'} · ${label}`})}).then(r=>r.json());
  if(res.error){ setStatus(res.error); return; }
  RESULT=res; RESULT.name=`${ACTIVE||'group'} · ${label}`;
  WORKING=res.spec?JSON.parse(JSON.stringify(res.spec)):null;
  VIEW=Osiris.defaultView(res); renderSwitcher(); await renderCurrent();
}
function setView(v){ VIEW=v; postConsole({view:v}); renderSwitcher(); renderCurrent(); }
function clearAll(){ RESULT=null; VIEW=null; WORKING=null; renderSwitcher(); renderComposerBar();
  showBoard(); board.clear(); $('boardtitle').textContent='Board'; setStatus('Cleared.'); }

// The left navigator's contents. For a COLLECTION room it's the selected case's objects; for a
// developer room (no collection) it's the whole GRAPH — so a newly-ingested repo shows up at
// once (ingest adds to the graph, not to a case; the case-scoped set was blind to it). Capped +
// grouped/collapsed by type keeps it browsable.
function objectSetUrl(){
  const room = ROOMS.find(r=>r.id===ROOM);
  const collect = !!(room && room.config && room.config.collect);
  return (collect && ANALYSIS) ? `/objects?case_id=${ANALYSIS}&limit=1500` : `/objects?limit=1500`;
}
async function loadObjectSet(){
  const r = await fetch(objectSetUrl()).then(r=>r.json()).catch(()=>[]);
  SET = Array.isArray(r) ? r : [];   // never let an error body poison the set (SET.filter)
  $('setn').textContent = SET.length; renderSet();
}
let SET_COLLAPSED={};
function renderSet(){
  const q=($('filter').value||'').toLowerCase();
  const rows = SET.filter(o => (o.name||o.canonical).toLowerCase().includes(q) || o.type.toLowerCase().includes(q));
  if(!rows.length){ $('set').innerHTML='<div class="o-empty">No objects match.</div>'; return; }
  // group by type — a calm hierarchy (Commit ▾ 60 / Thread ▾ 5 …) over a flat hash list.
  const groups={};
  rows.forEach(o=>(groups[o.type]=groups[o.type]||[]).push(o));
  // fewest-first: the small, navigable sets (5 repos, 13 decisions, 8 threads) surface ABOVE
  // the bulk (hundreds of commits/files), instead of being buried under them.
  const types=Object.keys(groups).sort((a,b)=>groups[a].length-groups[b].length);
  $('set').innerHTML = types.map(t=>{
    // default: small groups (repos/decisions/threads) OPEN, bulk groups (100s of commits/files)
    // COLLAPSED — so the navigable sets show at a glance; an explicit toggle always wins.
    const items=groups[t];
    const open = t in SET_COLLAPSED ? !SET_COLLAPSED[t] : items.length<=40;
    const head=`<div class="set-group" onclick="toggleSetGroup('${esc(t)}')">
      <span class="set-caret">${open?'▾':'▸'}</span><span class="dot" style="background:${ty(t).c}"></span>
      <span class="set-gname">${esc(t)}</span><span class="set-gn">${items.length}</span></div>`;
    const body=open?items.slice(0,200).map(o=>`
      <div class="item${FOCUS===o.id?' sel':''}" onclick="inspectOnly('${o.id}')"
        ondblclick="primaryAction('${o.id}','${esc(o.type)}')"
        oncontextmenu="event.preventDefault();showActionMenu(event.clientX,event.clientY,'${o.id}','${esc(o.type)}')"
        title="${esc(o.canonical)}">
        <span class="lab">${esc(o.name||o.canonical)}</span></div>`).join('') : '';
    return head+body;
  }).join('');
}
function toggleSetGroup(t){ SET_COLLAPSED[t]=!SET_COLLAPSED[t]; renderSet(); }

// ---- focus / inspect / search-around (the one noun) ------------------------
// focus() is the EXPLORE verb now — invoked from the right-click "Search around" action (or a
// double-click on a non-doc), NOT from a single click. It leaves the current lens (clears the
// composition cursor), draws the object's neighbourhood on the board, and inspects it.
async function focus(id){
  FOCUS=id; postConsole({focused_object_id:id, composition:null}); ACTIVE=null;
  renderSet();
  RESULT=null; WORKING=null; renderSwitcher(); renderComposerBar();  // exploring ≠ viewing a result
  showBoard();
  // ALWAYS draw the neighbourhood (idempotent merge) — clicking a node should SHOW what it
  // connects to, not just highlight it among strangers. This is what surfaces "the meat"
  // (a thread → the commits that noted it) onto the board instead of burying it in the rail.
  await searchAround(id, true);
  board.focusNode(id);
  inspect(id);
}
const NEIGHBOR_CAP=28;
async function searchAround(id, quiet){
  id = id || FOCUS; if(!id) return;
  showBoard(); setStatus('Searching around…');
  const g = await fetch(`/objects/${id}/graph?hops=1`).then(r=>r.json());
  // degree-aware: a hub (asuramaya authored 100+ commits) would explode the board into an
  // unreadable hairball. Summarize, don't enumerate — keep the focused node + the nearest
  // NEIGHBOR_CAP; the FULL set stays reachable via the inspector's grouped "open as set".
  let capped=0;
  if(g.nodes.length>NEIGHBOR_CAP+1){
    capped=g.nodes.length-1;
    const keep=new Set([id, ...g.nodes.filter(n=>n.id!==id).slice(0,NEIGHBOR_CAP).map(n=>n.id)]);
    g.nodes=g.nodes.filter(n=>keep.has(n.id));
    g.edges=g.edges.filter(e=>keep.has(e.source)&&keep.has(e.target));
  }
  const added = board.mergeGraph(g);
  board.layout(board.cy.nodes().length>1);
  setStatus(capped
    ? `Showing ${NEIGHBOR_CAP} of ${capped} connections — open a relationship as a set (inspector) for all.`
    : `${board.cy.nodes().length} objects on the board${added?` (+${added})`:''}.`);
  $('boardtitle').textContent = `Board · ${board.cy.nodes().length} objects`;
}
// ---- the object action menu (right-click) — type-aware, reads the ontology ---------------
// One click INSPECTS (light, safe). A right-click offers what you can DO with this object,
// scoped to its TYPE (a Commit reads its diff; a Person gets a Dossier). These actions moved
// OUT of the always-visible inspector chrome into here — the shell frame stays neutral, the
// menu is contextual. Double-click runs the primary (first) action. Later this map can live in
// /schema; for now a small type→actions map with universal fallbacks (Search around / Tag).
const _CONTENT_TYPES = new Set(['Commit','Reference','SoftwareProject']);
const _ENTITY_TYPES = new Set(['Person','Organization','CryptoAddress','Property','CourtCase',
                               'ClinicalTrial','Identity']);
function actionsFor(type){
  const a=[];
  if(_CONTENT_TYPES.has(type)) a.push({label:'Read ▸', run:viewContent});   // primary for docs
  a.push({label:'Search around', run:focus});                                // explore on the board
  if(type==='Person') a.push({label:'★ This is me', run:claimIdentity});     // unify your dev identity
  if(_ENTITY_TYPES.has(type)) a.push({label:'Dossier', run:dossierFor});
  a.push({label:'Tag…', run:tagIt});
  return a;
}
// "This is me": the first Person claimed becomes your canonical identity; a later claim merges
// that identity into it — unifying you across repos where the resolver can't (real name vs handle).
async function claimIdentity(id){
  const r=await fetch(`/objects/${id}/claim-identity`,{method:'POST'}).then(r=>r.ok?r.json():null).catch(()=>null);
  if(!r){ setStatus('Could not claim identity.'); return; }
  setStatus({designated:'Marked as you — now claim your other identities too.',
             merged:'Merged into your identity — your work is unified across repos.',
             'already-self':'That identity is already you.'}[r.action] || 'Done.');
  await loadObjectSet();          // a Person may have merged away — refresh the navigator
  if(r.self) inspectOnly(r.self);
}
function primaryAction(id, type){ const a=actionsFor(type)[0]; if(a) a.run(id); }  // double-click
async function dossierFor(id){ await inspect(id); showDossier(id); }               // inspect, then dossier
let ACTIONMENU=null;
function closeActionMenu(){ if(ACTIONMENU){ ACTIONMENU.remove(); ACTIONMENU=null; } }
function showActionMenu(x, y, id, type){
  closeActionMenu();
  const acts=actionsFor(type);
  const m=document.createElement('div'); m.className='actionmenu'; ACTIONMENU=m;
  m.innerHTML=`<div class="am-h">${esc(type||'object')}</div>`+
    acts.map((a,i)=>`<div class="am-i" data-i="${i}">${esc(a.label)}</div>`).join('');
  document.body.appendChild(m);
  const r=m.getBoundingClientRect();
  m.style.left=Math.min(x, innerWidth-r.width-8)+'px';
  m.style.top=Math.min(y, innerHeight-r.height-8)+'px';
  m.querySelectorAll('.am-i').forEach(el=> el.onclick=(ev)=>{ ev.stopPropagation();
    const a=acts[+el.dataset.i]; closeActionMenu(); a.run(id); });
}
document.addEventListener('mousedown', e=>{ if(ACTIONMENU && !ACTIONMENU.contains(e.target)) closeActionMenu(); });

async function inspect(id){
  const o = await fetch('/objects/'+id).then(r=>r.ok?r.json():null);
  // render the empty state into #right directly — the first successful inspect replaces
  // #right's innerHTML (destroying the original #insp), so dereferencing it here threw.
  if(!o){ const right=$('right'); right.className='rail';
    right.innerHTML='<div class="insp-empty">Object not found.</div>'; return; }
  // the inspector is DISPLAY-only — its actions moved to the right-click menu (contextual,
  // type-aware). A tiny hint keeps them discoverable without cluttering the frame with chrome.
  const right=$('right'); right.className='rail';
  right.innerHTML = objectDetail(o) +
    `<div class="o-hint">right-click for actions · double-click for the primary one</div>
     <div class="o-sect" id="dossbox" style="display:none"><h3>Dossier</h3>
      <pre id="doss" class="r-pre"></pre></div>`;
  loadRels(right.querySelector('[data-rels]'), id, inspectOnly,
           (type,dir,label)=>openAsSet(id,type,dir,label));
}
// ---- the document viewer: render a node's CONTENT properly in the center (a doc primitive) -
// A Reference/doc → its markdown rendered; a Commit → its git-show DIFF, syntax-coloured. The
// knowledge in the graph becomes READABLE, not a clamped text blob.
async function viewContent(id){
  setStatus('Loading…');
  const c=await fetch('/objects/'+id+'/content').then(r=>r.ok?r.json():null);
  if(!c||c.kind==='none'){ setStatus('No readable content for this object.'); return; }
  RESULT=null; WORKING=null; renderSwitcher(); renderComposerBar();
  const panel=$('result');
  const head=`<div class="doc-h">${esc(c.title)}${c.kind==='diff'?' · diff':''}</div>`;
  panel.innerHTML=`<div class="docview">${head}`+(c.kind==='diff'
    ? renderDiff(c.content)
    : `<div class="md">${marked.parse(c.content)}</div>`)+`</div>`;
  showPanel(); $('boardtitle').textContent=c.title; setStatus(`Reading ${c.title}.`);
}
function renderDiff(text){
  const body=text.split('\n').map(l=>{
    const c = (l[0]==='+'&&l.slice(0,3)!=='+++')?'add'
      : (l[0]==='-'&&l.slice(0,3)!=='---')?'del'
      : l.startsWith('@@')?'hunk'
      : (l.startsWith('diff ')||l.startsWith('index ')||l.startsWith('+++')||l.startsWith('---'))?'meta':'';
    return `<span class="dl ${c}">${esc(l)||' '}</span>`;
  }).join('');
  return `<div class="diff">${body}</div>`;
}
// W3: promote a relationship group into the center as a RESULT SET (the typed pivot →
// object set → view). Reuses the W1 view-switcher: the 80 'authored_by' become a table.
async function openAsSet(oid, type, dir, label){
  setStatus(`Opening ${label}…`);
  const res = await fetch(`/objects/${oid}/related?type=${encodeURIComponent(type)}&direction=${dir}`)
    .then(r=>r.json());
  res.name = label; RESULT=res; WORKING=null; VIEW=Osiris.defaultView(res); ACTIVE=null; loadComps();
  renderSwitcher(); await renderCurrent();
}

function watch(){
  if(STREAM) STREAM.close();
  STREAM=new EventSource(`/cases/${ANALYSIS}/stream`);
  STREAM.onmessage=async ev=>{
    const s=JSON.parse(ev.data);
    $('live').textContent = s.total!=null ? `● ${s.total} objects` : '';
    const fresh=await fetch(objectSetUrl()).then(r=>r.json());
    if(fresh.length!==SET.length){ SET=fresh; $('setn').textContent=SET.length; renderSet();
      // only auto-grow the board while EXPLORING (no result shown). A composition RESULT is
      // never clobbered by a stream tick — that was the blank-board bug.
      if(FOCUS && RESULT===null && !$('stage').classList.contains('panel')) searchAround(FOCUS,true); }
  };
}

function cmtab(el){ cmode=el.dataset.m;

function addCond(prop='',op='eq',val=''){

async function saveCompose(){
  if(cmode==='watch'){
    const type=$('w_type').value.trim();
    const where=[...$('conds').querySelectorAll('.cond')].map(d=>{
      const [pi,sel,vi]=d.querySelectorAll('input,select');
      return {property:pi.value.trim(),op:sel.value,value:vi.value.trim()};
    }).filter(c=>c.property&&c.value);
    const name=(type||'Any')+(where.length?` where ${where.map(c=>c.property+Osiris.OPSYM[c.op]+c.value).join(' ∧ ')}`:'');
    await fetch('/subscriptions',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({name,criteria:{object_type:type||null,where},
        webhook_url:$('w_hook').value.trim()||null, room_id:ROOM||null})});
  } else {
    let spec; try{ spec=JSON.parse($('s_spec').value); }catch(e){ $('cmsg').textContent='Invalid JSON.'; return; }
    await fetch('/compositions',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({name:$('s_name').value.trim()||'untitled',spec,kind:'lens',room_id:ROOM||null})});
  }
  closePeek(); loadComps();
}

// ---- global search ---------------------------------------------------------
let st;
function debouncedSearch(){ clearTimeout(st); st=setTimeout(globalSearch,180); }
async function globalSearch(){
  const q=$('search').value.trim(); closePop();
  if(q.length<2) return;
  // one engine (rung 1): the bar searches KNOWLEDGE via fn_search — grade x recency ranked,
  // snippet = the matched testimony — and the query lands in the retrieval telemetry.
  const res=await fetch(`/search?q=${encodeURIComponent(q)}&limit=12`).then(r=>r.json());
  const hits=(res&&res.hits)||[];
  const pop=document.createElement('div'); pop.className='pop'; pop.id='searchpop';
  const r=$('search').getBoundingClientRect(); pop.style.left=r.left+'px'; pop.style.top=(r.bottom+5)+'px';
  pop.style.width=r.width+'px'; pop.style.maxHeight='340px'; pop.style.overflowY='auto';
  pop.innerHTML = hits.length ? hits.map(o=>`
    <div class="item" onmousedown="pick('${o.id}')">
      <span class="dot" style="background:${ty(o.type).c}"></span>
      <span class="lab">${esc(o.snippet ? o.snippet.replace(/<\/?b>/g,'') : o.canonical)}</span>
      <span class="ty">${o.type}</span>
    </div>`).join('') : '<div class="o-empty">No matches.</div>';
  document.body.appendChild(pop);
}
function pick(id){ closePop(); $('search').value=''; focus(id); }
function closePop(){ ['searchpop','keypop'].forEach(i=>{const p=$(i);if(p)p.remove();}); }
document.addEventListener('click',e=>{ if(!e.target.closest('#search')&&!e.target.closest('#searchpop')) {const p=$('searchpop');if(p)p.remove();} });

// ---- type key + review -----------------------------------------------------
function toggleKey(ev){ ev.stopPropagation(); const ex=$('keypop'); if(ex){ex.remove();return;}
  const pop=document.createElement('div'); pop.className='pop'; pop.id='keypop';
  const r=ev.target.getBoundingClientRect(); pop.style.right='14px'; pop.style.top=(r.bottom+5)+'px';
  fetch('/schema').then(r=>r.json()).then(cat=>{
    const c={}; cat.object_types.forEach(t=>{(c[t.category]=c[t.category]||[]).push(t);});
    pop.innerHTML=Object.entries(c).map(([cat,ts])=>
      `<div class="o-faint" style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 2px">${cat}</div>`+
      ts.map(t=>`<div class="keyrow"><span class="dot" style="background:${t.color}"></span>${t.name}</div>`).join('')
    ).join('');
  });
  document.body.appendChild(pop);
  setTimeout(()=>document.addEventListener('click',function h(){pop.remove();document.removeEventListener('click',h);}),0);
}
async function refreshReview(){
  const m=await fetch('/merge-candidates').then(r=>r.json()).catch(()=>[]);
  $('reviewN').textContent = (m&&m.length)||0;
}
async function openReview(){
  closePop();
  const m=await fetch('/merge-candidates').then(r=>r.json()).catch(()=>[]);
  const body = m.length ? m.slice(0,40).map(c=>{
      const reason = Array.isArray(c.reasons)?c.reasons[0]:(c.reasons||'possible duplicate');
      return `<div class="rev-row">
        <div><b>${Math.round((c.score||0)*100)}%</b> <span class="o-muted">${esc(reason)}</span></div>
        <div style="font-size:12px;margin:3px 0">
          <a onmousedown="pick('${c.a_id}')" style="cursor:pointer">${esc(c.a_label)}</a>
          <span class="o-faint">(${esc(c.a_type)})</span> <span class="o-faint">↔</span>
          <a onmousedown="pick('${c.b_id}')" style="cursor:pointer">${esc(c.b_label)}</a>
          <span class="o-faint">(${esc(c.b_type)})</span></div>
        <div class="o-acts" style="margin-top:3px">
          <button class="o-act go" onmousedown="resolveCand(${c.id},'merged')">Merge</button>
          <button class="o-act" onmousedown="resolveCand(${c.id},'rejected')">Reject</button></div></div>`;
    }).join('') : '<div class="o-empty">Nothing to review.</div>';
  openPeek('Merge review · resolve in place', body);
}
async function resolveCand(id, decision){
  await fetch(`/merge-candidates/${id}/resolve`,{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify({decision})});
  await refreshReview();
  await loadObjectSet();   // a merge changed the object set — refresh it (room-aware)
  if(FOCUS) inspect(FOCUS);
  openReview();
}

// deep links: /ui/?id=<obj> focuses an object (the old object page); /ui/?run=<name>
// runs a composition (the old watch page). The console pages are now render modes here.
async function applyDeepLink(){
  const q=new URLSearchParams(location.search);
  if(q.get('id')) await focus(q.get('id'));
  if(q.get('run')) await runComp(q.get('run'));
}

// ---- calm: collapse the side panels to give the content room (U3 — open calm) ----------
function _afterResize(){ if(board&&board.resizeFit) setTimeout(()=>board.resizeFit(),180); }
function toggleLeft(){ $('main').classList.toggle('lefthidden'); _afterResize(); }
function toggleRight(){ $('main').classList.toggle('righthidden'); _afterResize(); }

// ---- peek: a summoned surface with its OWN panel (U2 — one panel, one job) --------------
// Review / compose used to float as popovers OVER the inspector rail, covering the focused
// object (two jobs in one place). They're now clean centered "peeks" with a dim backdrop —
// summoned, dismissible (esc / click-out), and the rail is left to do only its one job.
function openPeek(title, html, onMount){
  const ov=$('peek'); ov.className='peek-overlay on';
  ov.innerHTML=`<div class="peek" onclick="event.stopPropagation()">
    <div class="peek-head"><span>${esc(title)}</span><span class="peek-x" onclick="closePeek()">✕</span></div>
    <div class="peek-body" id="peekbody">${html}</div></div>`;
  ov.onclick=closePeek;
  if(onMount) onMount($('peekbody'));
}
function closePeek(){ const o=$('peek'); o.className='peek-overlay'; o.innerHTML=''; }

// ---- the command surface: ⌘K / slash palette (Notion's one command home) ---------------
// Every action lives here — run a lens, find an object, search-around, expand, switch room,
// the board verbs — summoned with a keystroke, dismissed when done. This is what lets the
// global toolbar shrink toward zero (U4): the screen stays calm, the power stays one key away.
let PAL_OPEN=false, PAL_SEL=0, PAL_CMDS=[], PAL_FLAT=false;
// rank a result by match quality so intent beats coincidence: exact < prefix < word-start <
// substring (typing 'compose' puts the Compose ACTION above the 'composer arc' lens).
function _palScore(label, ql){
  const l=label.toLowerCase();
  if(l===ql) return 0; if(l.startsWith(ql)) return 1;
  return new RegExp('\\b'+ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(l) ? 2 : 3;
}
function paletteCommands(q){
  const ql=q.toLowerCase(), cmds=[];
  COMPS.forEach(c=>cmds.push({cat:'Run a lens', label:c.name, hint:c.kind, run:()=>runComp(c.name)}));
  cmds.push({cat:'Room', label:'All — god view', run:()=>switchRoom('')});
  ROOMS.forEach(r=>cmds.push({cat:'Room', label:r.name, run:()=>switchRoom(r.id)}));
  [['Expand — run collectors',expandSet],
   ['Search around the focused object',()=>FOCUS?searchAround(FOCUS):setStatus('Focus an object first.')],
   ['Compose a watch / composition',()=>openCompose()], ['Merge review',openReview],
   ['New analysis',newAnalysis],
   ['Toggle the sidebar',toggleLeft], ['Toggle the inspector',toggleRight],
   ['Fit the board',()=>board.fit()], ['Re-layout',()=>board.layout(false)],
   ['Clear the board',clearAll]
  ].forEach(([label,run])=>cmds.push({cat:'Action', label, run}));
  return ql ? cmds.filter(c=>c.label.toLowerCase().includes(ql)||c.cat.toLowerCase().includes(ql)) : cmds;
}
async function paletteObjects(q){
  if(q.length<2) return [];
  const r=await fetch(`/objects?q=${encodeURIComponent(q)}&limit=8`).then(r=>r.json()).catch(()=>[]);
  return r.map(o=>({cat:'Object', label:o.label||o.canonical||o.id, hint:o.type, run:()=>focus(o.id)}));
}
function openPalette(){
  PAL_OPEN=true; PAL_SEL=0;
  const ov=$('palette'); ov.className='palette-overlay on';
  ov.innerHTML=`<div class="palette" onclick="event.stopPropagation()">
    <input id="palinput" placeholder="Run a lens, find an object, or an action…" autocomplete="off">
    <div id="pallist" class="pallist"></div>
    <div class="pal-foot"><span>↵ run · ↑↓ move · esc close</span></div></div>`;
  ov.onclick=closePalette;
  const inp=$('palinput'); inp.oninput=refreshPalette; inp.onkeydown=palKey; inp.focus();
  refreshPalette();
}
function closePalette(){ PAL_OPEN=false; const o=$('palette'); o.className='palette-overlay'; o.innerHTML=''; }
async function refreshPalette(){
  const q=($('palinput')?.value||'').trim();
  let cmds=[...paletteCommands(q), ...await paletteObjects(q)];
  if(q){ const ql=q.toLowerCase();  // searching → flat, ranked by relevance (intent first)
    cmds=cmds.map((c,i)=>[_palScore(c.label,ql),i,c]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>x[2]); }
  PAL_CMDS=cmds; PAL_FLAT=!!q;  // empty → grouped by category (browse)
  if(PAL_SEL>=PAL_CMDS.length) PAL_SEL=0;
  renderPalette();
}
function renderPalette(){
  const list=$('pallist'); if(!list) return;
  if(!PAL_CMDS.length){ list.innerHTML='<div class="pal-empty">No matches.</div>'; return; }
  let html='', lastCat=null;
  PAL_CMDS.forEach((c,i)=>{
    if(!PAL_FLAT && c.cat!==lastCat){ html+=`<div class="pal-cat">${esc(c.cat)}</div>`; lastCat=c.cat; }
    const hint = PAL_FLAT ? (c.hint||c.cat) : c.hint;  // flat rows show their category as the hint
    html+=`<div class="pal-row${i===PAL_SEL?' sel':''}" data-i="${i}">
      <span class="pal-label">${esc(c.label)}</span>${hint?`<span class="pal-hint">${esc(hint)}</span>`:''}</div>`;
  });
  list.innerHTML=html;
  list.querySelectorAll('[data-i]').forEach(el=>{
    el.onmouseenter=()=>{ PAL_SEL=+el.dataset.i; paintSel(); };
    el.onclick=palExec;
  });
  paintSel();
}
function paintSel(){
  document.querySelectorAll('#pallist .pal-row').forEach(el=>el.classList.toggle('sel',+el.dataset.i===PAL_SEL));
  const sel=document.querySelector('#pallist .sel'); if(sel) sel.scrollIntoView({block:'nearest'});
}
function palKey(e){
  if(e.key==='ArrowDown'){ e.preventDefault(); PAL_SEL=Math.min(PAL_SEL+1,PAL_CMDS.length-1); paintSel(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); PAL_SEL=Math.max(PAL_SEL-1,0); paintSel(); }
  else if(e.key==='Enter'){ e.preventDefault(); palExec(); }
  else if(e.key==='Escape'){ e.preventDefault(); closePalette(); }
}
function palExec(){ const c=PAL_CMDS[PAL_SEL]; if(!c) return; closePalette(); c.run(); }
document.addEventListener('keydown',e=>{
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); PAL_OPEN?closePalette():openPalette(); }
  else if(e.key==='/'&&!PAL_OPEN&&!inField){ e.preventDefault(); openPalette(); }
  else if(e.key==='Escape'&&$('peek').className.includes('on')){ closePeek(); }
  else if(e.key==='['&&!inField){ e.preventDefault(); toggleLeft(); }
  else if(e.key===']'&&!inField){ e.preventDefault(); toggleRight(); }
});

Osiris.loadSchema().then(async()=>{
  await loadRooms();
  // LAND ON THE CONSOLE ROOM (the persona), not the first case's graph. switchRoom loads the
  // room's compositions and runs its `home` lens (engineer → briefing) — the "where am I?"
  // surface. If the cursor named a different composition, resume that. Falls back to the All
  // room when the cursor names none. (The old boot opened the first case and focused its first
  // object — that's why it always landed on a stray case graph, ignoring the room.)
  const cur = await fetch('/console').then(r=>r.ok?r.json():null).catch(()=>null);
  await switchRoom((cur && cur.room_id) || '');
  // switchRoom ran the room's HOME lens (the orientation). Only override it when CLAUDE is
  // actively steering — then a reload follows Claude's view; a human always gets a fresh
  // "where am I" (home), not wherever they last happened to click.
  if(cur && cur.updated_by==='claude' && cur.composition && cur.composition!==ACTIVE)
    await runComp(cur.composition);
  await applyDeepLink();
  watchConsole(); });  // open the shared-cursor link with Claude
