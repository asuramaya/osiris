# Full hosted topology (cron Phase 7) — the rings as separate units, coordinating
# only through Postgres + Redis (the bus; no RPC mesh). Cut 1 of the deployment ladder.
# Bring up:  docker compose -f deploy/docker-compose.full.yml up -d --build
# (this box has no compose plugin yet — see deploy/up.sh for the docker-run fallback.)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: osiris
      POSTGRES_PASSWORD: osiris
      POSTGRES_DB: osiris
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # tuning: deploy/postgresql.conf has the full justification (thread e6fd3772 piece
    # 1) — override-only -c flags, never replace the image's own generated config.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=12GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "random_page_cost=1.1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osiris -d osiris"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # one-shot: bring the schema to head before the surfaces start
  migrate:
    build: { context: .., dockerfile: Dockerfile }
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment: &app_env
      DATABASE_URL: postgresql://osiris:osiris@postgres:5432/osiris
      REDIS_URL: redis://redis:6379/0
      OSIRIS_ACTOR: analyst:operator
      OSIRIS_ARTIFACT_DIR: /var/lib/osiris/artifacts
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # the human surface (restartable edge — holds no state)
  api:
    build: { context: .., dockerfile: Dockerfile }
    environment: *app_env
    ports: ["127.0.0.1:8011:8011"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: always

  # the worker (cascade drain + watch + reaper) — fate-isolated from the API
  worker:
    build: { context: .., dockerfile: Dockerfile }
    command: ["uv", "run", "arq", "src.workers.arq_worker.WorkerSettings"]
    environment: *app_env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: always

  # a placeful satellite (Phase 6) — opt-in via `--profile satellite`; in a real
  # deploy this runs at a different vantage/box, reaching only Postgres.
  satellite:
    build: { context: .., dockerfile: Dockerfile }
    command: ["uv", "run", "python", "-m", "src.orchestrator.satellite"]
    environment: *app_env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: always
    profiles: ["satellite"]

volumes:
  pgdata:
  redisdata:
