# osiris-pg tuning — thread e6fd3772 piece (1), measured 2026-08-17 against the live
# fleet instance, not guessed from a generic sizing guide alone.
#
# THE GAP: osiris-pg has run the official postgres:16 image's STOCK defaults since it was
# first stood up — shared_buffers=128MB, work_mem=4MB, effective_cache_size=4GB,
# maintenance_work_mem=64MB, random_page_cost=4.0 (the spinning-disk default) — on a host
# with 61GB RAM (35GB available, 21GB already in OS buff/cache) and an NVMe-backed data
# volume (/var/lib/docker/volumes/osiris-pg-data, nvme0n1, ROTA=0 — confirmed via
# `lsblk -d -o NAME,ROTA`), holding a 4.4GB database (assertions alone 2.8GB/3.12M rows,
# the single hottest table every orient()/search()/mount() call touches repeatedly).
#
# NOT SIZED AS "25% of host RAM" (the usual dedicated-server rule of thumb): this host is
# SHARED — `free -h` showed 25GB already in use before Postgres's own footprint, by the
# rest of the fleet's own processes and agent sessions. Values below target "comfortably
# holds the actual working set" over "claim a fixed fraction of the box."
#
# THE EVIDENCE (EXPLAIN ANALYZE, live, read-only, this session):
#   - orient()'s own heaviest real query (compositions.open_thread_wall, the open-thread
#     WALL every mount/orient call runs): 29.2ms, `Buffers: shared hit=33993 read=2006` —
#     2006 blocks (~16MB) missed Postgres's own 128MB shared_buffers pool on a SINGLE
#     project's wall against a 2.8GB assertions table.
#   - `SELECT event_type, count(*) FROM outbox GROUP BY event_type` (a full scan over
#     outbox's 3.2M rows/608MB): 338ms cold, 343ms WARM (re-run immediately after) —
#     `Buffers: ... read=61268` BOTH times, meaning even a warm re-run still fell through
#     Postgres's own buffer pool into a read() syscall for essentially every block (served
#     fast today only because the OS page cache happens to be warm and the host has spare
#     RAM — incidental, not structural; a colder OS cache or more fleet memory pressure
#     turns those into real disk-adjacent latency instead of a syscall-overhead-only cost).
#   - A THIRD finding, not a tuning value but load-bearing for this file's own confidence
#     in the numbers above: `pg_stat_user_tables.n_live_tup` for audit_log reads 245,854 —
#     the REAL count (measured via `SELECT count(*)`) is 3,219,472, a ~13x undercount.
#     `last_autoanalyze` for audit_log is NULL — it has never been auto-analyzed despite
#     3.2M inserts (n_dead_tup=0, so this isn't a dead-tuple/bloat story, it's a stats-
#     collection gap). The query PLANNER is working off stale/absent statistics for one of
#     the three largest tables in the database. autovacuum_analyze_scale_factor (0.1,
#     stock) is untouched below — the honest fix here is a per-table storage parameter
#     (see the ALTER TABLE lines in deploy/postgres_tuning.sql), not a global GUC; noted
#     here so the "why raise maintenance_work_mem" reasoning below has this in view too.
#
# HOW TO APPLY: this file is the justified REFERENCE — the actual apply paths are (1)
# deploy/docker-compose.full.yml's postgres service `command:` (individual -c flags,
# override-only, never replaces the image's own generated config) for a fresh compose-
# managed stack, or (2) deploy/postgres_tuning.sql (ALTER SYSTEM, works against the
# EXISTING running container with no data-volume remount) for a hand-run container like
# this box's own osiris-pg. Neither is applied by this build — shared_buffers and
# maintenance_work_mem need a container restart to take effect, which is the operator's
# own act (deploy/postgres_tuning.sql says so at the top).

# --- memory --------------------------------------------------------------------------
# Comfortably holds the CURRENT 4.4GB database (assertions 2.8GB + outbox 0.6GB +
# audit_log 0.7GB + everything else) with real headroom for growth, without claiming a
# fixed fraction of a host this box shares with the rest of the fleet. Requires a
# container restart.
shared_buffers = 4GB

# A PLANNER HINT ONLY (no allocation) — how much OS-level cache the planner should
# assume is realistically available for Postgres's own data, so it favors index scans
# with appropriate confidence. 12GB is well within the 35GB this host reported available
# (18GB free + some of the 21GB already-warm buff/cache), still conservative relative to
# the 61GB total on a box other processes also need. Reloadable via SIGHUP, no restart.
effective_cache_size = 12GB

# Stock 4MB is tight for this project's own sort/hash-heavy queries (the search relax
# door's own corpus-scan comment already documents a related pain: 213M temp-read
# buffers from a re-scanned CTE, fixed by query rewrite, not memory — but it's the same
# CLASS of query this raises headroom for). 32MB keeps worst-case exposure bounded even
# at max_connections=100 (100 x 32MB = 3.2GB ceiling, a small slice of 61GB, and real
# concurrent connection count on this box runs far below the max). Reloadable, no
# restart.
work_mem = 32MB

# Speeds up VACUUM/ANALYZE/CREATE INDEX on the three multi-million-row tables
# (assertions/outbox/audit_log) — directly relevant to the audit_log stats-staleness
# finding above: a manual `ANALYZE audit_log` after this lands will be markedly faster.
# Reloadable, no restart.
maintenance_work_mem = 512MB

# --- planner cost model ----------------------------------------------------------------
# The stock default (4.0) models 1990s-era spinning-disk seek cost, penalizing index
# scans relative to sequential ones. Confirmed NVMe-backed (nvme0n1, ROTA=0) — 1.1 is the
# standard SSD-appropriate value, letting the planner trust index scans (assertions_is_
# current_idx, assertions_object_name_idx — both already doing real work in the
# open_thread_wall EXPLAIN above) without an artificial seek-cost penalty. Reloadable, no
# restart.
random_page_cost = 1.1
